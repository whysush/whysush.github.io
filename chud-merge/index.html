<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4eedf">
<title>Chud Merge</title>
<meta name="description" content="Flick chuds up the table. Two of the same merge into the next tier. Merge two Ascended to win.">
<link rel="icon" href="assets/t9.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#e7dfcc;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;box-shadow:0 0 0 1px rgba(22,20,18,.15),0 10px 40px rgba(60,40,10,.18)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="Chud Merge game"></canvas></div>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
   CHUD MERGE
   A flick-and-merge game in the style of "Juices Merge".
   Physics run in flat table coordinates (x across, y from the far
   end y=0 to the near end y=L). Rendering projects the table into a
   trapezoid so the far end looks smaller, like the original game.
------------------------------------------------------------------ */

const VW = 540, VH = 960;                 // logical canvas size in CSS pixels before scaling
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const INK = '#161412';                    // pen colour for every outline
const PAPER = '#f4eedf';                  // sketchbook paper colour
const RED = '#c8321f';                    // red pen, used for the danger line and warnings

// Nine tiers, in the order of the reference sheet. r = collision radius in table units.
const TIERS = [
  { name: 'SOYLET',        r: 24, pts: 2    },
  { name: 'INTERN SOY',    r: 29, pts: 6    },
  { name: 'GASPER',        r: 34, pts: 14   },
  { name: 'CONSOOMER',     r: 40, pts: 30   },
  { name: 'DISCORD MOD',   r: 46, pts: 64   },
  { name: 'REDDIT ADMIN',  r: 53, pts: 130  },
  { name: 'BASEMENT LORD', r: 60, pts: 270  },
  { name: 'FINAL BOSS',    r: 68, pts: 550  },
  { name: 'ASCENDED',      r: 76, pts: 1100 },
];
const WIN_BONUS = 5000;                   // points for merging two ASCENDED

// Table geometry in table units.
const TW = 360, TL = 640;
const LINE_Y = 470;                       // the dashed danger line; a resting head nearer than this ends the game
const SPAWN_Y = 576;                      // where the held head waits to be flicked
// Projection: screen y is linear in table y; width scale grows from far (0.82) to near (1.36).
const TOP_Y = 232, Y_SCALE = 0.95, CX = 270, S_FAR = 0.82, S_NEAR = 1.36;
const sAt = y => S_FAR + (S_NEAR - S_FAR) * (y / TL);
const P = (x, y) => { const s = sAt(y); return [CX + (x - TW / 2) * s, TOP_Y + y * Y_SCALE, s]; };
const unPY = sy => (sy - TOP_Y) / Y_SCALE;
const unPX = (sx, y) => TW / 2 + (sx - CX) / sAt(y);

// Physics constants.
const FRICTION_EXP = 1.25;                // exponential velocity decay per second
const FRICTION_LIN = 55;                  // constant deceleration in units/s^2, so heads come to a full stop
const WALL_REST = 0.5;                    // bounciness of the table rails
const BALL_REST = 0.45;                   // bounciness between heads
const MIN_SHOT = 420, MAX_SHOT = 1500;    // launch speed range in units/s

/* ---------------- seeded randomness for the sketchy lines ---------------- */
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------- hand-drawn primitives ----------------
   Every line is drawn twice with small random offsets and a bent
   midpoint, which reads as a pen stroke instead of a vector line. */
function jl(g, R, x1, y1, x2, y2, j = 1.4, n = 2) {
  for (let i = 0; i < n; i++) {
    const mx = (x1 + x2) / 2 + (R() - .5) * j * 1.8, my = (y1 + y2) / 2 + (R() - .5) * j * 1.8;
    g.beginPath();
    g.moveTo(x1 + (R() - .5) * j, y1 + (R() - .5) * j);
    g.quadraticCurveTo(mx, my, x2 + (R() - .5) * j, y2 + (R() - .5) * j);
    g.stroke();
  }
}
function jpoly(g, R, pts, closed = true, j = 1.4, n = 2) {
  const m = pts.length;
  for (let i = 0; i < (closed ? m : m - 1); i++) {
    const p = pts[i], q = pts[(i + 1) % m];
    jl(g, R, p[0], p[1], q[0], q[1], j, n);
  }
}
function polyPath(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) g.lineTo(p[0], p[1]); g.closePath(); }
function smoothPath(g, pts, closed) {
  g.beginPath();
  const m = pts.length;
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  if (closed) {
    let s = mid(pts[m - 1], pts[0]); g.moveTo(s[0], s[1]);
    for (let i = 0; i < m; i++) { const q = mid(pts[i], pts[(i + 1) % m]); g.quadraticCurveTo(pts[i][0], pts[i][1], q[0], q[1]); }
    g.closePath();
  } else {
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < m - 1; i++) { const q = mid(pts[i], pts[i + 1]); g.quadraticCurveTo(pts[i][0], pts[i][1], q[0], q[1]); }
    g.lineTo(pts[m - 1][0], pts[m - 1][1]);
  }
}
// Wobbly ellipse: drawn n times, each pass slightly different. fill (optional) is painted under the first pass.
function jell(g, R, cx, cy, rx, ry, j = 1.6, n = 2, fill) {
  for (let k = 0; k < n; k++) {
    const N = Math.max(10, Math.round((rx + ry) / 5)), a0 = R() * 6.283, pts = [];
    for (let i = 0; i < N; i++) {
      const a = a0 + i / N * 6.283;
      pts.push([cx + Math.cos(a) * (rx + (R() - .5) * j), cy + Math.sin(a) * (ry + (R() - .5) * j)]);
    }
    smoothPath(g, pts, true);
    if (fill && k === 0) { g.fillStyle = fill; g.fill(); }
    g.stroke();
  }
}
// Parallel hatching clipped to the current path (call after building a path).
function hatchClip(g, R, x0, y0, x1, y1, gap = 7, ang = -0.9, lw = 1, alpha = .55) {
  g.save(); g.clip();
  g.lineWidth = lw; g.globalAlpha = alpha;
  const c = Math.cos(ang), s = Math.sin(ang), L = Math.hypot(x1 - x0, y1 - y0) + 40;
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  for (let d = -L; d < L; d += gap) {
    const px = mx - s * d, py = my + c * d;
    jl(g, R, px - c * L, py - s * L, px + c * L, py + s * L, 1.2, 1);
  }
  g.restore();
}
function jrect(g, R, x, y, w, h, fill, j = 1.6) {
  if (fill) { g.fillStyle = fill; polyPath(g, [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]); g.fill(); }
  jpoly(g, R, [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], true, j, 2);
}

/* ---------------- sprites ---------------- */
const SPR = [], SIL = [];
function loadSprites() {
  return Promise.all(TIERS.map((_, i) => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      SPR[i] = im;
      // Silhouette used in the progression bar for tiers you have not reached yet.
      const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      const g = c.getContext('2d'); g.drawImage(im, 0, 0);
      g.globalCompositeOperation = 'source-in'; g.fillStyle = '#2a2622'; g.fillRect(0, 0, c.width, c.height);
      SIL[i] = c; res();
    };
    im.onerror = rej;
    im.src = `assets/t${i + 1}.png`;
  })));
}
function drawSprite(img, cx, cy, size, rot = 0) {
  const sc = size / Math.max(img.width, img.height);
  const w = img.width * sc, h = img.height * sc;
  if (rot) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore(); }
  else ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
}

/* ---------------- background scene (beach bar, all ink on paper) ---------------- */
function cloud(g, R, x, y, k) {
  const pts = [], bumps = 7;
  for (let i = 0; i < bumps; i++) {
    const a = Math.PI + i / (bumps - 1) * Math.PI;
    pts.push([x + Math.cos(a) * 62 * k, y + Math.sin(a) * 26 * k]);
  }
  g.fillStyle = '#fbf8ef';
  g.beginPath(); g.moveTo(x - 62 * k, y);
  for (let i = 0; i < bumps - 1; i++) {
    const p = pts[i], q = pts[i + 1], mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2 - 14 * k;
    g.quadraticCurveTo(mx + (R() - .5) * 4, my + (R() - .5) * 4, q[0], q[1]);
  }
  g.closePath(); g.fill(); g.stroke();
  jl(g, R, x - 66 * k, y + 1, x + 66 * k, y + 1, 1.5, 1);
}
function palm(g, R) {
  g.lineWidth = 2;
  const base = [52, 900], top = [96, 318];
  const trunk = t => { const u = 1 - t; return [u * u * base[0] + 2 * u * t * 30 + t * t * top[0], u * u * base[1] + 2 * u * t * 600 + t * t * top[1]]; };
  const L = [], Rr = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24, p = trunk(t), q = trunk(Math.min(1, t + .01));
    const ang = Math.atan2(q[1] - p[1], q[0] - p[0]) + Math.PI / 2, w = 13 - t * 5;
    L.push([p[0] + Math.cos(ang) * w, p[1] + Math.sin(ang) * w]);
    Rr.push([p[0] - Math.cos(ang) * w, p[1] - Math.sin(ang) * w]);
  }
  g.fillStyle = '#efe5cf'; polyPath(g, L.concat(Rr.slice().reverse())); g.fill();
  smoothPath(g, L, false); g.stroke(); smoothPath(g, Rr, false); g.stroke();
  g.lineWidth = 1.4;
  for (let i = 1; i < 24; i++) { const a = L[i], b = Rr[i]; g.beginPath(); g.moveTo(a[0], a[1]); g.quadraticCurveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + 5, b[0], b[1]); g.stroke(); }
  g.lineWidth = 2;
  const fr = [[-2.7, 120], [-2.2, 110], [-1.6, 70], [-0.9, 105], [-0.35, 95], [-3.05, 85], [0.3, 70]];
  for (const [a, len] of fr) {
    const ex = top[0] + Math.cos(a) * len, ey = top[1] + Math.sin(a) * len + 40;
    const cx2 = top[0] + Math.cos(a) * len * .55, cy2 = top[1] + Math.sin(a) * len * .55 - 22;
    const pts = [];
    for (let i = 0; i <= 12; i++) {
      const t = i / 12, u = 1 - t;
      pts.push([u * u * top[0] + 2 * u * t * cx2 + t * t * ex, u * u * top[1] + 2 * u * t * cy2 + t * t * ey]);
    }
    const up = [], dn = [];
    for (let i = 0; i <= 12; i++) {
      const t = i / 12, w = Math.sin(t * Math.PI) * 14;
      const p = pts[i], q = pts[Math.min(12, i + 1)], p0 = pts[Math.max(0, i - 1)];
      const ang = Math.atan2(q[1] - p0[1], q[0] - p0[0]) + Math.PI / 2;
      up.push([p[0] + Math.cos(ang) * w, p[1] + Math.sin(ang) * w]);
      dn.push([p[0] - Math.cos(ang) * w * .7, p[1] - Math.sin(ang) * w * .7]);
    }
    g.fillStyle = '#f6f1e4'; polyPath(g, up.concat(dn.slice().reverse())); g.fill();
    smoothPath(g, up, false); g.stroke(); smoothPath(g, dn, false); g.stroke();
    g.lineWidth = 1.2; smoothPath(g, pts, false); g.stroke();
    for (let i = 2; i < 12; i += 1) { const p = pts[i], q = up[i]; jl(g, R, p[0], p[1], q[0] * .7 + p[0] * .3, q[1] * .7 + p[1] * .3, .8, 1); }
    g.lineWidth = 2;
  }
  jell(g, R, top[0] - 6, top[1] + 8, 9, 8, 1.2, 1, '#fff'); jell(g, R, top[0] + 9, top[1] + 12, 8, 8, 1.2, 1, '#fff');
}
function umbrella(g, R) {
  g.lineWidth = 2.2;
  jl(g, R, 498, 300, 512, 870, 1.5, 2);
  const cx = 498, cy = 300, w = 112, h = 62;
  const pts = [];
  for (let i = 0; i <= 20; i++) { const a = Math.PI + i / 20 * Math.PI; pts.push([cx + Math.cos(a) * w, cy + Math.sin(a) * h]); }
  g.fillStyle = '#fbf8ef';
  polyPath(g, pts); g.fill();
  smoothPath(g, pts, false); g.stroke();
  // scalloped rim + alternating hatched panels
  const panels = 6;
  for (let i = 0; i < panels; i++) {
    const a0 = Math.PI + i / panels * Math.PI, a1 = Math.PI + (i + 1) / panels * Math.PI;
    const x0 = cx + Math.cos(a0) * w, y0 = cy + Math.sin(a0) * h * 0.05, x1 = cx + Math.cos(a1) * w, y1 = y0;
    g.beginPath(); g.moveTo(x0, cy); g.quadraticCurveTo((x0 + x1) / 2, cy + 14, x1, cy); g.stroke();
    jl(g, R, cx, cy - h, x0, cy, 1.2, 1);
    if (i % 2 === 0) {
      g.beginPath(); g.moveTo(cx, cy - h); g.lineTo(x0, cy); g.quadraticCurveTo((x0 + x1) / 2, cy + 14, x1, cy); g.closePath();
      hatchClip(g, R, Math.min(x0, x1), cy - h, Math.max(x0, x1), cy + 14, 6, -0.7, 1, .5);
    }
  }
  jell(g, R, cx, cy - h - 4, 5, 5, 1, 1, '#fff');
}
function drawBG(g, seed) {
  const R = rng(seed);
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = INK;
  g.fillStyle = PAPER; g.fillRect(0, 0, VW, VH);
  // paper grain (fixed seed so it does not flicker between line-boil frames)
  const N = rng(7);
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(90,70,40,${.03 + N() * .05})`; g.fillRect(N() * VW, N() * VH, 1 + N(), 1 + N()); }

  // sky
  g.lineWidth = 2;
  cloud(g, R, 150, 204, .8); cloud(g, R, 320, 196, .6);
  const SX = 430, SY = 168;
  jell(g, R, SX, SY, 22, 22, 1.4, 2, '#fff6d6');
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * 6.283 + .2;
    jl(g, R, SX + Math.cos(a) * 29, SY + Math.sin(a) * 29, SX + Math.cos(a) * (37 + (i % 2) * 6), SY + Math.sin(a) * (37 + (i % 2) * 6), 1, 1);
  }
  g.lineWidth = 1.6;
  for (const [bx, by, k] of [[230, 172, 1], [256, 160, .7], [500, 150, .8]]) {
    g.beginPath(); g.moveTo(bx - 10 * k, by); g.quadraticCurveTo(bx - 5 * k, by - 7 * k, bx, by); g.quadraticCurveTo(bx + 5 * k, by - 7 * k, bx + 10 * k, by); g.stroke();
  }

  // sea
  g.lineWidth = 2; jl(g, R, -10, 214, VW + 10, 214, 1.5, 2);
  g.lineWidth = 1.4;
  for (let row = 0; row < 5; row++) {
    const y = 230 + row * 17;
    for (let x = -10 + (row % 2) * 18; x < VW; x += 36 + R() * 14) {
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 7, y - 6, x + 14, y); g.quadraticCurveTo(x + 21, y + 6, x + 28, y); g.stroke();
    }
  }
  // shoreline with foam
  g.lineWidth = 2;
  const shore = []; for (let x = -10; x <= VW + 10; x += 30) shore.push([x, 322 + Math.sin(x / 40) * 6 + (R() - .5) * 4]);
  smoothPath(g, shore, false); g.stroke();
  g.lineWidth = 1.2;
  for (let x = 0; x < VW; x += 22) { g.beginPath(); g.arc(x + R() * 10, 330 + Math.sin(x / 40) * 6, 3 + R() * 2, Math.PI, 0); g.stroke(); }
  // sand stipple
  g.fillStyle = INK;
  const SD = rng(11);
  for (let i = 0; i < 520; i++) { const x = SD() * VW, y = 340 + SD() * 620; g.globalAlpha = .35; g.fillRect(x + (R() - .5), y, 1.6, 1.6); }
  g.globalAlpha = 1;
  // a starfish and shells in the gutters
  g.lineWidth = 1.6;
  const star = (x, y, r) => { const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * 6.283, rr = i % 2 ? r * .45 : r; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); } g.fillStyle = '#fbf8ef'; polyPath(g, pts); g.fill(); jpoly(g, R, pts, true, 1, 1); };
  star(28, 640, 13); star(515, 720, 11);
  const shell = (x, y) => { g.fillStyle = '#fbf8ef'; g.beginPath(); g.moveTo(x - 10, y); g.quadraticCurveTo(x, y - 18, x + 10, y); g.closePath(); g.fill(); g.stroke(); for (let k = -1; k <= 1; k++) jl(g, R, x + k * 4, y, x, y - 12, .6, 1); };
  shell(24, 520); shell(520, 560);

  palm(g, R);
  umbrella(g, R);

  // awning + string lights along the top
  g.lineWidth = 2;
  g.fillStyle = '#fbf8ef'; g.fillRect(0, 0, VW, 22);
  const sw = 45;
  for (let i = 0; i < VW / sw + 1; i++) {
    const x = i * sw;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 22); g.quadraticCurveTo(x + sw / 2, 40, x + sw, 22); g.lineTo(x + sw, 0); g.closePath();
    if (i % 2 === 0) { g.fillStyle = '#e9dfc8'; g.fill(); hatchClip(g, R, x, 0, x + sw, 40, 5, -0.8, 1, .55); }
    else { g.fillStyle = '#fbf8ef'; g.fill(); }
    g.beginPath(); g.moveTo(x, 22); g.quadraticCurveTo(x + sw / 2, 40, x + sw, 22); g.stroke();
    jl(g, R, x, 0, x, 22, 1, 1);
  }
  jl(g, R, 0, 22, VW, 22, 1.2, 1);
  g.lineWidth = 1.4;
  const wire = []; for (let x = -10; x <= VW + 10; x += 15) wire.push([x, 52 + Math.cos((x - 270) / 180) * -10]);
  smoothPath(g, wire, false); g.stroke();
  for (let x = 20; x < VW; x += 44) {
    const y = 52 + Math.cos((x - 270) / 180) * -10;
    jl(g, R, x, y, x, y + 6, .6, 1);
    jell(g, R, x, y + 13, 5, 7, 1, 1, '#fff9e0');
    for (const a of [-.6, .6, 0]) jl(g, R, x + Math.sin(a) * 10, y + 13 + Math.cos(a) * 11, x + Math.sin(a) * 14, y + 13 + Math.cos(a) * 15, .5, 1);
  }

  drawTable(g, R);
}
function drawTable(g, R) {
  const fl = P(0, TL), fr = P(TW, TL), bl = P(0, 0), br = P(TW, 0);
  const TH = 28;                                  // thickness of the front edge in screen px
  // legs
  g.lineWidth = 2.2;
  for (const [lx, dir] of [[fl[0] + 26, 1], [fr[0] - 26, -1]]) {
    const pts = [[lx - 13, fl[1] + TH], [lx + 13, fl[1] + TH], [lx + 11 + dir * 4, 905], [lx - 11 + dir * 4, 905]];
    g.fillStyle = '#e4d4b0'; polyPath(g, pts); g.fill();
    polyPath(g, pts); hatchClip(g, R, lx - 14, fl[1], lx + 14, 905, 5, -1.2, 1, .6);
    jpoly(g, R, pts, true, 1.2, 2);
    g.fillStyle = 'rgba(30,20,10,.12)'; g.beginPath(); g.ellipse(lx + dir * 4, 907, 22, 5, 0, 0, 7); g.fill();
  }
  // front face
  const face = [[fl[0], fl[1]], [fr[0], fr[1]], [fr[0] - 4, fr[1] + TH], [fl[0] + 4, fl[1] + TH]];
  g.fillStyle = '#e3d1aa'; polyPath(g, face); g.fill();
  polyPath(g, face); hatchClip(g, R, fl[0], fl[1], fr[0], fr[1] + TH, 6, -1.35, 1, .5);
  jpoly(g, R, face, true, 1.4, 2);
  // top
  const top = [[bl[0], bl[1]], [br[0], br[1]], [fr[0], fr[1]], [fl[0], fl[1]]];
  g.fillStyle = '#efe3c6'; polyPath(g, top); g.fill();
  // planks converge toward the far end
  g.lineWidth = 1.5;
  for (let i = 1; i < 6; i++) { const a = P(TW * i / 6, 0), b = P(TW * i / 6, TL); jl(g, R, a[0], a[1], b[0], b[1], 1.6, 1); }
  // wood grain squiggles and knots
  g.lineWidth = 1;
  const G = rng(31);
  for (let k = 0; k < 46; k++) {
    const pl = Math.floor(G() * 6), x = TW * (pl + .25 + G() * .5) / 6, y0 = 10 + G() * (TL - 80), len = 30 + G() * 60;
    const pts = [];
    for (let t = 0; t <= 6; t++) { const yy = y0 + t / 6 * len, xx = x + Math.sin(t * 1.3 + k) * 3; pts.push(P(xx, yy)); }
    g.globalAlpha = .55; smoothPath(g, pts.map(p => [p[0] + (R() - .5) * .8, p[1]]), false); g.stroke(); g.globalAlpha = 1;
  }

    const x = -220 + i * 55;
    const img = i <= maxTier ? SPR[i] : SIL[i];
    drawSprite(img, x, 0, i === maxTier ? 44 : 38);
    if (i === maxTier) { ctx.strokeStyle = RED; ctx.lineWidth = 2; jell(ctx, R, x, 1, 27, 23, 1.6, 1); ctx.strokeStyle = INK; }
    if (i < 8) { ctx.fillStyle = INK; ctx.font = '16px "Patrick Hand"'; ctx.textAlign = 'center'; ctx.fillText('›', x + 27, 6); }
  }
  ctx.restore();
  // unlock banner
  if (banner) {
    const a = Math.min(1, banner.life * 2, (2.4 - banner.life) * 6);
    ctx.globalAlpha = a;
    ctx.save(); ctx.translate(270, 232); ctx.rotate(-.03);
    textBox(R, -150, -26, 300, 52, '#fff6d6');
    drawSprite(SPR[banner.t], -118, 0, 46);
    ctx.fillStyle = INK; ctx.font = '21px "Alfa Slab One"'; ctx.textAlign = 'center'; ctx.fillText(banner.text, 22, 8);
    ctx.restore(); ctx.globalAlpha = 1;
  }
}
function bigButton(R, cx, cy, w, label, fn, fill = '#fff6d6') {
  const h = 62, x = cx - w / 2, y = cy - h / 2;
  ctx.fillStyle = 'rgba(22,20,18,.85)'; polyPath(ctx, [[x + 6, y + 7], [x + w + 6, y + 7], [x + w + 6, y + h + 7], [x + 6, y + h + 7]]); ctx.fill();
  textBox(R, x, y, w, h, fill);
  ctx.fillStyle = INK; ctx.font = '28px "Alfa Slab One"'; ctx.textAlign = 'center'; ctx.fillText(label, cx, cy + 10);
  buttons.push({ x, y, w, h, fn });
}
function veil() { ctx.fillStyle = 'rgba(244,238,223,.9)'; ctx.fillRect(0, 0, VW, VH); }
function drawTitle(R) {
  veil();
  ctx.save(); ctx.translate(270, 132); ctx.rotate(-.04);
  ctx.fillStyle = INK; ctx.textAlign = 'center';
  ctx.font = '86px "Alfa Slab One"'; ctx.fillText('CHUD', 0, 0);
  ctx.font = '86px "Alfa Slab One"'; ctx.fillText('MERGE', 0, 84);
  ctx.strokeStyle = RED; ctx.lineWidth = 4; jl(ctx, R, -170, 108, 170, 102, 3, 2);
  ctx.restore();
  ctx.fillStyle = INK; ctx.font = '24px "Patrick Hand"'; ctx.textAlign = 'center';
  ctx.fillText('slide. merge. ascend.', 270, 290);
  // the full ladder, 3 x 3
  for (let i = 0; i < 9; i++) {
    const cx = 105 + (i % 3) * 165, cy = 370 + Math.floor(i / 3) * 140;
    drawSprite(SPR[i], cx, cy, 92, Math.sin(time * 2 + i) * .05);
    ctx.font = '15px "Alfa Slab One"'; ctx.fillStyle = INK; ctx.fillText(`${i + 1} · ${TIERS[i].name}`, cx, cy + 62);
  }
  ctx.font = '21px "Patrick Hand"';
  ctx.fillText('swipe a head up the table. two of the same merge.', 270, 776);
  ctx.fillText('anyone left behind the red line ends the run.', 270, 800);
  ctx.fillStyle = RED; ctx.fillText('merge two ASCENDED to win.', 270, 826);
  bigButton(R, 270, 884, 220, 'PLAY', () => newGame());
  if (best) { ctx.fillStyle = INK; ctx.font = '19px "Patrick Hand"'; ctx.fillText(`best ${best}`, 270, 942); }
}
function drawOver(R) {
  veil();
  ctx.save(); ctx.translate(270, 180); ctx.rotate(.03);
  ctx.fillStyle = INK; ctx.font = '72px "Alfa Slab One"'; ctx.textAlign = 'center';
  ctx.fillText('GAME', 0, 0); ctx.fillText('OVER', 0, 74);
  ctx.restore();
  drawSprite(SPR[7], 270, 400, 210, Math.sin(time * 18) * .03);
  ctx.fillStyle = INK; ctx.textAlign = 'center';
  ctx.font = '24px "Patrick Hand"'; ctx.fillText('a chud was left behind the line', 270, 545);
  ctx.font = '54px "Alfa Slab One"'; ctx.fillText(String(score), 270, 625);
  ctx.font = '22px "Patrick Hand"'; ctx.fillText(score >= best ? 'new best!' : `best ${best}`, 270, 660);
  ctx.fillText(`highest: ${TIERS[maxTier].name}`, 270, 690);
  bigButton(R, 270, 780, 240, 'AGAIN', () => newGame());
  bigButton(R, 270, 870, 240, 'MENU', () => { state = 'title'; pieces = []; held = null; }, '#fbf8ef');
}
function drawWin(R) {
  veil();
  // rotating rays behind the double ascended
  ctx.save(); ctx.translate(270, 400); ctx.rotate(time * .3);
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  for (let i = 0; i < 24; i++) { const a = i / 24 * 6.283; jl(ctx, R, Math.cos(a) * 140, Math.sin(a) * 140, Math.cos(a) * (165 + (i % 2) * 22), Math.sin(a) * (165 + (i % 2) * 22), 1.4, 1); }
  ctx.restore();
  ctx.strokeStyle = INK; jell(ctx, R, 270, 400, 132, 132, 2, 2, '#fff6d6');
  drawSprite(SPR[8], 270, 400, 230, Math.sin(time * 1.5) * .05);
  ctx.fillStyle = INK; ctx.textAlign = 'center';
  ctx.save(); ctx.translate(270, 104); ctx.rotate(-.03);
  ctx.font = '50px "Alfa Slab One"'; ctx.fillText('ASCENSION', 0, 0); ctx.fillText('COMPLETE', 0, 58);
  ctx.restore();
  ctx.font = '24px "Patrick Hand"'; ctx.fillText('two ASCENDED became one.', 270, 610); ctx.fillText('there is nothing left to become.', 270, 638);
  ctx.font = '50px "Alfa Slab One"'; ctx.fillText(String(score), 270, 702);
  ctx.font = '20px "Patrick Hand"'; ctx.fillStyle = RED; ctx.fillText(`YOU WIN  (+${WIN_BONUS} bonus)`, 270, 732);
  bigButton(R, 270, 800, 260, 'KEEP GOING', () => { state = 'rolling'; rollT = 0; settleT = 0; });
  bigButton(R, 270, 884, 260, 'NEW GAME', () => newGame(), '#fbf8ef');
}

/* ---------------- main loop ---------------- */
let last = performance.now(), boilIdx = 0, boilT = 0;
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now; time += dt;
  boilT += dt; if (boilT > .16) { boilT = 0; boilIdx = (boilIdx + 1) % 3; }

  if (state === 'aim' || state === 'rolling') {
    const sub = 6; for (let i = 0; i < sub; i++) step(dt / sub);
    for (const p of pieces) if (p.pop > 0) p.pop = Math.max(0, p.pop - dt * 4);
    if (state === 'rolling') {
      rollT += dt;
      const moving = pieces.some(p => Math.hypot(p.vx, p.vy) > 10);
      settleT = moving ? 0 : settleT + dt;
      if (settleT > .25 || rollT > 4.5) {
        if (pieces.some(p => p.y > LINE_Y)) gameOver(); else spawnHeld();
      }
    }
  }
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }

  const R = rng(boilIdx * 9973 + 1);
  buttons.length = 0;
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const sh = shake > .2 ? shake : 0; shake *= Math.pow(.02, dt);
  ctx.save();
  if (sh) ctx.translate((Math.random() - .5) * sh, (Math.random() - .5) * sh);
  ctx.drawImage(BOIL[boilIdx], 0, 0, VW, VH);
  const warn = (state === 'aim' || state === 'rolling') && pieces.some(p => !p.held && p.y + p.r > LINE_Y);
  drawDangerLine(R, warn);
  drawAimGuide(R);
  const sorted = pieces.slice().sort((a, b) => a.y - b.y);
  for (const p of sorted) drawPiece(p, R);
  if (hammerMode) {
    const hp = pointer && pickPiece(pointer[0], pointer[1]);
    if (hp) { const [px, py, s] = P(hp.x, hp.y); ctx.strokeStyle = RED; ctx.lineWidth = 3; jell(ctx, R, px, py - hp.r * s * .35, hp.r * s * 1.2, hp.r * s * 1.2, 2, 1); }
  }
  drawFx(R, dt);
  ctx.restore();
  if (state !== 'title') drawHUD(R);
  if (state === 'title') drawTitle(R);
  else if (state === 'over') drawOver(R);
  else if (state === 'win') drawWin(R);
  requestAnimationFrame(frame);
}

// expose a small hook so the game can be driven in automated tests
window.__chud = {
  get state() { return state; }, get pieces() { return pieces; }, get score() { return score; },
  newGame, launch: (vx, vy) => held && state === 'aim' && launch(vx, vy),
  setHeld: (t) => { if (held) { held.t = t; held.r = TIERS[t].r; } },
  place: (t, x, y) => { const p = makePiece(t, x, y); pieces.push(p); return p; },
};

addEventListener('resize', resize);
Promise.all([loadSprites(), document.fonts ? Promise.all([document.fonts.load('40px "Alfa Slab One"'), document.fonts.load('20px "Patrick Hand"')]).catch(() => {}) : 0])
  .then(() => { resize(); requestAnimationFrame(t => { last = t; frame(t); }); });
})();
</script>
</body>
</html>
