<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Embedded Lab Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Connections, setup, code and viva questions for the 8 embedded systems lab experiments.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: lab-bench reference — experiment rail on the left, one experiment at a time on the right,
   four tabs (Connections · Setup · Code · Viva). Solder-mask green accent, copper for "remember". */
:root{
  --bg:#f2f4f1; --panel:#ffffff; --sunk:#e8ece7; --fg:#15201a; --muted:#56635c; --line:#d2d9d3;
  --accent:#0b6a4d; --accent-ink:#ffffff; --accent-soft:#dbeee4;
  --copper:#9c5418; --copper-soft:#f6e7d8; --warn:#a3401a; --warn-soft:#fbe9df;
  --code-bg:#0f1916; --code-fg:#dce8e2; --code-line:#24332d; --code-muted:#7f948a;
  --tk-com:#7f948a; --tk-str:#e7b56f; --tk-kw:#7fd3ae; --tk-fn:#8cc3ff; --tk-num:#f29a86; --tk-pp:#d6a5ff;
  --w-gnd:#39433e; --w-pwr:#c2372a; --w-s1:#1d6db0; --w-s2:#0b8a5a; --w-s3:#b06e06; --w-s4:#7a3caf;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1412; --panel:#151d1a; --sunk:#1b2521; --fg:#e2ebe6; --muted:#9aaaa2; --line:#2a3732;
  --accent:#4cc596; --accent-ink:#06130e; --accent-soft:#173a2d;
  --copper:#e39a5c; --copper-soft:#33241a; --warn:#f08a5d; --warn-soft:#35201a;
  --code-bg:#0a100e; --code-line:#1f2b26;
  --w-gnd:#a4b0aa; --w-pwr:#ff7b6b; --w-s1:#6cb5f2; --w-s2:#4fd29c; --w-s3:#f0b44f; --w-s4:#c49af1;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1412; --panel:#151d1a; --sunk:#1b2521; --fg:#e2ebe6; --muted:#9aaaa2; --line:#2a3732;
  --accent:#4cc596; --accent-ink:#06130e; --accent-soft:#173a2d;
  --copper:#e39a5c; --copper-soft:#33241a; --warn:#f08a5d; --warn-soft:#35201a;
  --code-bg:#0a100e; --code-line:#1f2b26;
  --w-gnd:#a4b0aa; --w-pwr:#ff7b6b; --w-s1:#6cb5f2; --w-s2:#4fd29c; --w-s3:#f0b44f; --w-s4:#c49af1;
  color-scheme:dark; }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--f-body)}
[hidden]{display:none!important}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:.08em .35em;border-radius:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
.mark{flex:none;width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.mark svg{display:block}
.brand h1{margin:0;font:750 1.25rem/1.1 var(--f-display);letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.85rem}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-block:24px 64px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start}
.rail-label{font:600 .72rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 10px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pick{display:grid;grid-template-columns:30px 1fr;gap:2px 8px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.pick:hover{background:var(--sunk)}
.pick .n{font:600 .9rem/1 var(--f-mono);color:var(--muted);grid-row:span 2}
.pick .t{font-weight:600;line-height:1.25}
.pick .b{font-size:.8rem;color:var(--muted);line-height:1.2}
.pick[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.pick[aria-current="true"] .n,.pick[aria-current="true"] .b{color:inherit;opacity:.85}
.rail .ref{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}

main{min-width:0}
.kicker{font:600 .75rem/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.exp-title{margin:0;font:750 clamp(1.7rem,3.6vw,2.4rem)/1.08 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.lede{margin:10px 0 0;max-width:62ch;color:var(--muted);font-size:1.05rem}
.eq{display:inline-block;margin-top:14px;font:600 .92rem/1.4 var(--f-mono);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;max-width:100%;overflow-x:auto;white-space:pre}

.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--sunk);margin-top:18px}
.seg button{border:0;background:none;padding:6px 16px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:12px 14px 11px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .count{font:600 .72rem/1 var(--f-mono);background:var(--sunk);color:var(--muted);padding:3px 6px;border-radius:20px}

.panel{padding-top:22px;display:flex;flex-direction:column;gap:20px}
.panel h3{margin:0;font:700 1.02rem/1.3 var(--f-body)}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.note{margin:0;color:var(--muted);font-size:.94rem;max-width:72ch}
.notes{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;color:var(--fg);max-width:72ch}

.diagram{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;padding:14px}
.diagram svg{display:block;width:100%;min-width:420px;height:auto}
.dg-box{fill:var(--sunk);stroke:var(--line)}
.dg-head{fill:var(--fg);font:700 13px var(--f-body)}
.dg-pin{fill:var(--fg);font:600 12.5px var(--f-mono)}
.dg-sig{font:600 12px var(--f-body);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.k-gnd{stroke:var(--w-gnd);fill:var(--w-gnd)} .k-pwr{stroke:var(--w-pwr);fill:var(--w-pwr)}
.k-s1{stroke:var(--w-s1);fill:var(--w-s1)} .k-s2{stroke:var(--w-s2);fill:var(--w-s2)}
.k-s3{stroke:var(--w-s3);fill:var(--w-s3)} .k-s4{stroke:var(--w-s4);fill:var(--w-s4)}
.dg-sig.k-gnd,.dg-sig.k-pwr,.dg-sig.k-s1,.dg-sig.k-s2,.dg-sig.k-s3,.dg-sig.k-s4{stroke:var(--panel)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:600 .74rem/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
td.mono{font-family:var(--f-mono);font-size:.88rem;white-space:nowrap}
.truth td,.truth th{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.truth th:first-child,.truth td:first-child{text-align:left}

.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:2px;max-width:78ch}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);font:600 .82rem/1 var(--f-mono);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-top:1px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.toolbar .seg{margin-top:0}
.code{border-radius:var(--r);overflow:hidden;background:var(--code-bg);border:1px solid var(--code-line);min-width:0}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--code-line)}
.code-head span{font:600 .8rem/1.3 var(--f-mono);color:var(--code-muted);min-width:0;overflow-wrap:anywhere}
.copy{flex:none;border:1px solid var(--code-line);background:transparent;color:var(--code-fg);font:600 .78rem/1 var(--f-body);padding:6px 10px;border-radius:6px;cursor:pointer}
.copy:hover{background:var(--code-line)}
.code pre{margin:0;padding:14px;overflow-x:auto;color:var(--code-fg);font:400 .82rem/1.6 var(--f-mono);tab-size:2}
.tk-com{color:var(--tk-com);font-style:italic} .tk-str{color:var(--tk-str)} .tk-kw{color:var(--tk-kw)}
.tk-fn{color:var(--tk-fn)} .tk-num{color:var(--tk-num)} .tk-pp{color:var(--tk-pp)}
.out pre{margin:0;padding:12px 14px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);font:400 .8rem/1.55 var(--f-mono)}

.callout{border-radius:var(--r);padding:12px 14px;max-width:78ch}
.callout b.lbl{display:block;font:600 .72rem/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.remember{background:var(--copper-soft)} .remember b.lbl{color:var(--copper)}
.traps{background:var(--warn-soft)} .traps b.lbl{color:var(--warn)}
.traps ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}

.viva{display:flex;flex-direction:column;gap:8px;max-width:80ch}
.viva details{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.viva summary{cursor:pointer;list-style:none;padding:12px 14px;display:grid;grid-template-columns:38px 1fr 18px;gap:8px;align-items:baseline;font-weight:600}
.viva summary::-webkit-details-marker{display:none}
.viva summary .qn{font:600 .8rem/1 var(--f-mono);color:var(--accent)}
.viva summary::after{content:"+";font:600 1.1rem/1 var(--f-mono);color:var(--muted);text-align:right}
.viva details[open] summary::after{content:"−"}
.viva .ans{padding:0 14px 13px 60px;color:var(--fg)}
.viva .ans p{margin:0}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{background:var(--sunk)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:14px 48px}
  .rail{position:static}
  .rail-label{display:none}
  .rail ol{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:thin}
  .rail li{flex:none}
  .pick{grid-template-columns:auto auto;gap:6px;padding:8px 12px;border:1px solid var(--line);background:var(--panel);white-space:nowrap;align-items:center}
  .pick .n{grid-row:auto}
  .pick .b{display:none}
  .rail .ref{margin:0;border:0;padding:0}
  .viva .ans{padding-left:14px}
  .viva summary{grid-template-columns:32px 1fr 18px}
}
@media (prefers-reduced-motion:no-preference){ .panel{animation:rise .18s ease-out} @keyframes rise{from{transform:translateY(4px)}to{transform:none}} }
</style>
</head>

<header class="top"><div class="wrap">
  <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="5" y="5" width="10" height="10" rx="1.5" stroke="var(--accent-ink)" stroke-width="1.6"/><path d="M8 5V1.5M12 5V1.5M8 18.5V15M12 18.5V15M5 8H1.5M5 12H1.5M18.5 8H15M18.5 12H15" stroke="var(--accent-ink)" stroke-width="1.6" stroke-linecap="round"/></svg></div>
  <div class="brand"><h1>Embedded Lab Bench</h1><p>IIT Patna EE lab · 8 experiments · connections, setup, code and viva</p></div>
</div></header>

<div class="wrap shell">
  <nav class="rail" aria-label="Experiments">
    <p class="rail-label">Experiments</p>
    <ol id="picker"></ol>

  <main id="main" tabindex="-1"></main>
</div>

<script type="application/json" id="data">{"exps": [{"id": "e1", "num": "1", "title": "IIR Filter", "pick": "IIR filter", "board": "Arduino Uno", "line": "Remove 50 Hz noise from a 2 Hz sine with a first-order recursive low-pass filter, and plot input and output together.", "parts": [{"equation": "y[n] = 0.969·y[n−1] + 0.0155·x[n] + 0.0155·x[n−1]", "conn": {"rows": [["Arduino Uno USB port", "USB cable", "PC"]], "notes": ["No other wiring. The noisy input is generated inside the code from <code>micros()<\/code>, so pin A0 is declared in the handout but never used.", "To filter a real signal instead, feed 0–5 V into A0 and replace the <code>sin()<\/code> line with <code>x = analogRead(A0) / 1023.0;<\/code>."]}, "setup": ["Connect the Arduino Uno to the PC with the USB cable.", "Open Arduino IDE. Select <b>Tools → Board → Arduino Uno<\/b>, then <b>Tools → Port → COMx<\/b> (the port that appears when the board is plugged in).", "Paste the code. Click <b>Verify<\/b> (✓), then <b>Upload<\/b> (→) and wait for “Done uploading”.", "Open <b>Tools → Serial Plotter<\/b> and set the baud rate to <b>9600<\/b>. Serial Monitor shows the same two numbers per line as text."], "code": {"short": [{"label": "exp1_iir.ino", "lang": "c", "code": "float xp = 0, yp = 0;        // previous x, previous y\n\nvoid setup() { Serial.begin(9600); }\n\nvoid loop() {\n  float t = micros() / 1e6;                              // time in s\n  float x = (sin(2*PI*2*t) + 0.2*sin(2*PI*50*t)) / 1.2;  // signal+noise\n  float y = 0.969*yp + 0.0155*x + 0.0155*xp;             // IIR\n  Serial.print(x); Serial.print(\" \"); Serial.println(y); // 2 traces\n  xp = x;  yp = y;                                       // shift memory\n  delay(1);\n}"}], "lab": [{"label": "exp1_iir.ino (handout photo)", "lang": "c", "code": "// IIR filter design\nfloat xn1 = 0;               // x[n-1]: previous input sample (starts at 0)\nfloat yn1 = 0;               // y[n-1]: previous output sample (starts at 0)\nconst int analogInputpin = A0;  // declared for a real sensor; NOT used (signal is synthetic)\n\nvoid setup() {\n  Serial.begin(9600);        // USB serial to PC at 9600 baud\n}\n\nvoid loop() {\n  float t = micros() / 1.0e6;   // time in seconds since reset\n\n  // creating the noisy signal: 2 Hz wanted component + 0.2 amplitude 50 Hz noise\n  float xn = sin(2 * 2 * PI * t) + 0.2 * sin(2 * 50 * PI * t);\n\n  // IIR difference equation: y[n] = 0.969 y[n-1] + 0.0155 x[n] + 0.0155 x[n-1]\n  float yn = 0.969 * yn1 + 0.0155 * xn + 0.0155 * xn1;\n\n  // Normalize signal by its maximum value (max |xn| = 1 + 0.2 = 1.2)\n  float max_xn = 1.2;\n  xn /= max_xn;\n\n  // Print normalized values: \"input output\" -> two traces on the Serial Plotter\n  Serial.print(xn);\n  Serial.print(\" \");\n  Serial.println(yn);\n\n  xn1 = xn;   // store x[n] as x[n-1] for the next iteration\n  yn1 = yn;   // store y[n] as y[n-1] for the next iteration\n  delay(1);   // 1 ms pause; actual loop period is dominated by serial printing\n}"}]}, "codeNote": "Do not name them <code>x1<\/code>/<code>y1<\/code> in your own code: <code>y1()<\/code> is already a maths function in AVR libc.", "output": "Two traces on the Serial Plotter: the noisy 2 Hz input, and a smooth, smaller, slightly delayed sine as output.", "remember": "three numbers <b>0.969, 0.0155, 0.0155<\/b>. They add to 1 (0.969 + 0.031), so DC gain = 1. IIR = output feeds back (y[n−1] on the right side).", "traps": ["Pseudocode says <b>−0.969<\/b>: wrong sign. That makes a high-pass that boosts the noise. Use +0.969.", "Handout code divides x by 1.2 <i>after<\/i> filtering; doing it before (as above) is correct."], "viva": [["What is the difference between IIR and FIR?", "IIR uses past outputs (feedback), so its impulse response never ends; FIR uses only present and past inputs, so its impulse response has finite length. IIR achieves a sharp response with very few coefficients but can be unstable and has non-linear phase. FIR is always stable and can have exactly linear phase."], ["Is this filter stable? Why?", "Yes. The only pole is at z = 0.969, and |0.969| &lt; 1, i.e. inside the unit circle."], ["What is the DC gain?", "H(1) = 0.031 / (1 − 0.969) = 1."], ["Where is the zero and what does it do?", "At z = −1 (ω = π, the Nyquist frequency). It forces zero output at f<sub>s<\/sub>/2."], ["What would happen with −0.969 (as in the pseudocode)?", "The pole moves to z = −0.969, near Nyquist. The filter becomes a resonant high-pass that boosts the 50 Hz noise instead of removing it."], ["What is the sampling frequency here?", "Not set explicitly. It is set by the loop time: serial printing at 9600 baud (~1 ms per character, ~12 characters per line) plus delay(1), giving roughly 75–85 Hz. A fixed f<sub>s<\/sub> would need a timer interrupt or a micros()-based scheduler."], ["How could this IIR be designed?", "Bilinear transform of an analog first-order RC low-pass H(s) = ω<sub>c<\/sub>/(s + ω<sub>c<\/sub>), substituting s = (2/T)(1 − z<sup>−1<\/sup>)/(1 + z<sup>−1<\/sup>)."], ["Why the Serial Plotter?", "It plots each space-separated number on a line as a separate trace, so input and output are compared on one time axis."]]}]}, {"id": "e2", "num": "2", "title": "FIR Filter", "pick": "FIR filter", "board": "Arduino Uno", "line": "Smooth a 4 Hz sine corrupted by 50 Hz noise with a 2-tap FIR (moving-average) filter.", "parts": [{"equation": "y[n] = 0.0155·x[n] + 0.0155·x[n−1]   (output ×15 for display)", "conn": {"rows": [["Arduino Uno USB port", "USB cable", "PC"]], "notes": ["No other wiring. The input signal is generated in code.", "A DSO is optional: the handout lists it, but the Serial Plotter is enough to see both signals."]}, "setup": ["Connect the Arduino Uno to the PC with the USB cable.", "Open Arduino IDE. Select <b>Tools → Board → Arduino Uno<\/b>, then <b>Tools → Port → COMx<\/b> (the port that appears when the board is plugged in).", "Paste the code. Click <b>Verify<\/b> (✓), then <b>Upload<\/b> (→) and wait for “Done uploading”.", "Open <b>Tools → Serial Plotter<\/b> and set the baud rate to <b>9600<\/b>. Serial Monitor shows the same two numbers per line as text."], "code": {"short": [{"label": "exp2_fir.ino", "lang": "c", "code": "float xp = 0;                // previous x\n\nvoid setup() { Serial.begin(9600); }\n\nvoid loop() {\n  float t = micros() / 1e6;\n  float x = (sin(2*PI*4*t) + 0.2*sin(2*PI*50*t)) / 1.2;\n  float y = 15 * (0.0155*x + 0.0155*xp);   // FIR, scaled x15 for display\n  Serial.print(x); Serial.print(\" \"); Serial.println(y);\n  xp = x;                                  // shift memory\n  delay(1);\n}"}], "lab": [{"label": "exp2_fir.ino (handout)", "lang": "c", "code": "// FIR filter\nconst int N = 2;                  // number of taps (filter length)\nfloat xn_buffer[N];               // xn_buffer[0] = x[n], xn_buffer[1] = x[n-1]; global, so starts at 0\nfloat b[N] = {0.0155, 0.0155};    // FIR coefficients b[0], b[1]\n\nvoid setup() {\n  Serial.begin(9600);             // USB serial to PC at 9600 baud\n}\n\nvoid loop() {\n  float t = micros() / 1.0e6;     // time in seconds\n\n  // input: 4 Hz wanted sine + 0.2 amplitude 50 Hz noise\n  float xn = sin(2 * 4 * PI * t) + 0.2 * sin(2 * 50 * PI * t);\n  xn = xn / 1.2;                  // divide by peak value 1.2 so |xn| <= 1\n\n  // shift the delay line: x[n-1] <- x[n] (loop runs from the oldest slot downward)\n  for (int i = N - 1; i > 0; i--) {\n    xn_buffer[i] = xn_buffer[i - 1];\n  }\n  xn_buffer[0] = xn;              // newest sample goes in slot 0\n\n  // convolution: yn = b[0]*x[n] + b[1]*x[n-1]\n  float yn = 0;\n  for (int i = 0; i < N; i++) {\n    yn += b[i] * xn_buffer[i];\n  }\n  yn = yn * 15;                   // display scaling only (DC gain 0.031 -> 0.465)\n\n  Serial.print(xn);               // trace 1: input\n  Serial.print(\" \");\n  Serial.println(yn);             // trace 2: output\n  delay(1);\n}"}]}, "codeNote": "The handout stores past inputs in an array <code>xn_buffer[N]<\/code> with coefficients <code>b[N]<\/code> and a for-loop. With N = 2 that is exactly the one line above. If asked for the general form: <code>y += b[i]*buf[i]<\/code> for i = 0…N−1.", "output": "Two traces: the 4 Hz input with fast ripple, and a smaller, smoothed copy delayed by half a sample.", "remember": "FIR = Exp 1 code <b>minus the 0.969·yp term<\/b>. Only inputs on the right side → no feedback → always stable. Equal coefficients = moving average.", "traps": ["The FIR pseudocode shows the IIR equation (copied from Exp 1).", "Comment \"normalize to 1.2 times\" — the code actually divides by 1.2."], "viva": [["Why is an FIR filter always stable?", "It has no feedback; all poles are at z = 0. A bounded input always gives a bounded output."], ["Why does FIR give linear phase?", "Symmetric coefficients b[k] = b[N−1−k] give a phase of −ω(N−1)/2, i.e. constant group delay (N−1)/2 samples."], ["What filter type is this?", "A 2-tap moving-average low-pass with a zero at Nyquist."], ["Why multiply the output by 15?", "Coefficients sum to 0.031, so the passband output is only 3.1% of the input; ×15 makes it visible. Normalised coefficients (0.5, 0.5) remove the need."], ["How do you get a sharper FIR?", "More taps: windowed-sinc (Hamming, Hann), Parks–McClellan, or frequency sampling. Cost: N multiply-adds per sample and (N−1)/2 samples delay."], ["FIR vs IIR for this task?", "The IIR in Experiment 1 gets a much lower cutoff with 3 coefficients. The FIR needs many more taps for the same selectivity but has linear phase and guaranteed stability."]]}]}, {"id": "e3", "num": "3", "title": "STM32 LED Blinking", "pick": "STM LED blinking", "board": "Nucleo-F401RE", "line": "Configure PA5 as a GPIO output and blink the on-board green LED LD2 with HAL functions.", "parts": [{"conn": {"rows": [["PA5", "GPIO output", "LD2 green LED (on-board), active-high: 1 = on"], ["ST-LINK USB", "USB cable", "PC"]], "notes": ["No external wiring. LD2 is already connected to PA5 on the Nucleo board."]}, "setup": ["Connect the Nucleo-F401RE to the PC with the USB cable (the ST-LINK connector at the top of the board). This powers, programs and debugs the board.", "In STM32CubeIDE: <b>File → New → STM32 Project<\/b>. Open the <b>Board Selector<\/b> tab, search <b>NUCLEO-F401RE<\/b>, select it, click Next.", "Enter a project name. Keep Language = C and Binary = Executable. Set <b>Targeted Project Type = STM32Cube<\/b> (not Empty). Click Finish and answer <b>Yes<\/b> to “Initialize all peripherals with their default mode?”.", "In the Pinout view, left-click <b>PA5 → GPIO_Output<\/b>. With the default board template it is already labelled <b>LD2<\/b>, which creates <code>LD2_GPIO_Port<\/code> and <code>LD2_Pin<\/code>.", "Save the .ioc file or click <b>Device Configuration Tool Code Generation<\/b> (gear icon). CubeMX writes <code>Core/Src/main.c<\/code> with all init functions.", "Open <code>Core/Src/main.c<\/code>. Write your code only between <code>/* USER CODE BEGIN … */<\/code> and <code>/* USER CODE END … */<\/code>; anything outside is erased on the next code generation.", "Build with the <b>hammer<\/b> icon. The console should end with “Build Finished. 0 errors, 0 warnings.”", "Flash: <b>Run → Debug Configurations → STM32 C/C++ Application<\/b> → Debugger tab → tick <b>ST-LINK S/N<\/b> → <b>Scan<\/b> → Apply → Debug. After “Download verified successfully”, press <b>Resume (F8)<\/b>."], "code": {"short": [{"label": "main.c — inside while(1)", "lang": "c", "code": "/* USER CODE BEGIN 3 */\nHAL_GPIO_TogglePin(LD2_GPIO_Port, LD2_Pin);   // flip PA5\nHAL_Delay(100);                               // wait 100 ms\n/* USER CODE END 3 */"}, {"label": "Same result, handout style (4 lines)", "lang": "c", "code": "HAL_GPIO_WritePin(LD2_GPIO_Port, LD2_Pin, GPIO_PIN_SET);    // LED on\nHAL_Delay(100);\nHAL_GPIO_WritePin(LD2_GPIO_Port, LD2_Pin, GPIO_PIN_RESET);  // LED off\nHAL_Delay(100);"}], "lab": [{"label": "main.c (handout, with generated skeleton)", "lang": "c", "code": "#include \"main.h\"\nUART_HandleTypeDef huart2;             // generated: USART2 handle (ST-LINK virtual COM port)\nvoid SystemClock_Config(void);         // generated: sets system clock (84 MHz from HSI via PLL)\nstatic void MX_GPIO_Init(void);        // generated: enables GPIOA clock, PA5 as push-pull output\nstatic void MX_USART2_UART_Init(void); // generated: USART2 on PA2 (TX) / PA3 (RX)\n\nint main(void)\n{\n  HAL_Init();                // reset peripherals, init Flash interface, start 1 ms SysTick\n  SystemClock_Config();      // configure system clock\n  MX_GPIO_Init();            // configure PA5 (LD2) as output\n  MX_USART2_UART_Init();     // configure USART2 (unused in this experiment)\n\n  while (1)\n  {\n    /* USER CODE BEGIN 3 */\n    HAL_GPIO_WritePin(LD2_GPIO_Port, LD2_Pin, GPIO_PIN_SET);    // PA5 = 1 -> LED on\n    HAL_Delay(100);                                             // wait 100 ms\n    HAL_GPIO_WritePin(LD2_GPIO_Port, LD2_Pin, GPIO_PIN_RESET);  // PA5 = 0 -> LED off\n    HAL_Delay(100);                                             // wait 100 ms\n  }\n  /* USER CODE END 3 */\n}\n\n// Equivalent with one call per half-period:\n//   HAL_GPIO_TogglePin(LD2_GPIO_Port, LD2_Pin);  HAL_Delay(100);"}]}, "output": "LD2 blinks 100 ms on, 100 ms off: a 200 ms period, 5 Hz.", "remember": "<b>Port + Pin + State<\/b> is the argument order of every GPIO call. Names come from the label: LD2 → <code>LD2_GPIO_Port<\/code>, <code>LD2_Pin<\/code>.", "traps": ["Handout claims a 1000 ms interval; 100 + 100 ms gives a 200 ms period.", "Handout says choose \"Empty\" project: then no .ioc and no generated code. Choose STM32Cube."], "viva": [["What does HAL_Init() do?", "Resets peripherals, configures the Flash prefetch/caches, sets NVIC priority grouping, and starts SysTick at 1 ms for HAL_Delay and timeouts."], ["Push-pull vs open-drain?", "Push-pull actively drives high and low. Open-drain only pulls low and floats otherwise; used for wired-AND buses such as I2C."], ["Which register finally changes the pin?", "BSRR (bit set/reset register). Writing the lower 16 bits sets pins, upper 16 bits resets them, atomically. ODR holds the output state."], ["Why is HAL_Delay not ideal?", "It blocks the CPU. Non-blocking alternatives: compare HAL_GetTick() against a stored time, or use a hardware timer interrupt / PWM."], ["What is ST-LINK?", "The on-board programmer/debugger (SWD interface). It also exposes USART2 as a virtual COM port over the same USB cable."]]}]}, {"id": "e4", "num": "4", "title": "STM32 LED with Push Button", "pick": "STM LED with pushbutton", "board": "Nucleo-F401RE", "line": "Read the blue user button B1 on PC13 and turn LD2 on while it is pressed.", "parts": [{"conn": {"rows": [["PC13", "GPIO input", "B1 blue user button (on-board), active-low: pressed = 0"], ["PA5", "GPIO output", "LD2 green LED (on-board), active-high: 1 = on"], ["ST-LINK USB", "USB cable", "PC"]], "notes": ["No external wiring. B1 has an external pull-up and an RC debounce network on the board."]}, "setup": ["Connect the Nucleo-F401RE to the PC with the USB cable (the ST-LINK connector at the top of the board). This powers, programs and debugs the board.", "In STM32CubeIDE: <b>File → New → STM32 Project<\/b>. Open the <b>Board Selector<\/b> tab, search <b>NUCLEO-F401RE<\/b>, select it, click Next.", "Enter a project name. Keep Language = C and Binary = Executable. Set <b>Targeted Project Type = STM32Cube<\/b> (not Empty). Click Finish and answer <b>Yes<\/b> to “Initialize all peripherals with their default mode?”.", "Left-click <b>PC13 → GPIO_Input<\/b> (default label <b>B1<\/b>; the handout renames it <code>My_button<\/code> via right-click → Enter User Label). Left-click <b>PA5 → GPIO_Output<\/b> (label <b>LD2<\/b>).", "Save the .ioc file or click <b>Device Configuration Tool Code Generation<\/b> (gear icon). CubeMX writes <code>Core/Src/main.c<\/code> with all init functions.", "Open <code>Core/Src/main.c<\/code>. Write your code only between <code>/* USER CODE BEGIN … */<\/code> and <code>/* USER CODE END … */<\/code>; anything outside is erased on the next code generation.", "Build with the <b>hammer<\/b> icon. The console should end with “Build Finished. 0 errors, 0 warnings.”", "Flash: <b>Run → Debug Configurations → STM32 C/C++ Application<\/b> → Debugger tab → tick <b>ST-LINK S/N<\/b> → <b>Scan<\/b> → Apply → Debug. After “Download verified successfully”, press <b>Resume (F8)<\/b>."], "code": {"short": [{"label": "main.c — inside while(1)", "lang": "c", "code": "/* USER CODE BEGIN 3 */\nif (HAL_GPIO_ReadPin(B1_GPIO_Port, B1_Pin) == GPIO_PIN_RESET)  // pressed = 0\n  HAL_GPIO_WritePin(LD2_GPIO_Port, LD2_Pin, GPIO_PIN_SET);     // LED on\nelse\n  HAL_GPIO_WritePin(LD2_GPIO_Port, LD2_Pin, GPIO_PIN_RESET);   // LED off\n/* USER CODE END 3 */"}], "lab": [{"label": "main.c (handout, uses label My_button)", "lang": "c", "code": "#include \"main.h\"\nUART_HandleTypeDef huart2;             // generated: USART2 handle\nvoid SystemClock_Config(void);         // generated: system clock setup\nstatic void MX_GPIO_Init(void);        // generated: PC13 input, PA5 output, GPIOA/GPIOC clocks on\nstatic void MX_USART2_UART_Init(void); // generated: USART2 (unused here)\n\nint main(void)\n{\n  HAL_Init();                // reset peripherals, Flash interface, 1 ms SysTick\n  SystemClock_Config();\n  MX_GPIO_Init();\n  MX_USART2_UART_Init();\n\n  /* USER CODE BEGIN 2 */\n  uint8_t button_out = 0;    // holds the last read state of PC13\n  /* USER CODE END 2 */\n\n  while (1)\n  {\n    /* USER CODE BEGIN 3 */\n    button_out = HAL_GPIO_ReadPin(My_button_GPIO_Port, My_button_Pin); // 0 = pressed, 1 = released\n    if (button_out == 0)\n    {\n      HAL_GPIO_WritePin(LD2_GPIO_Port, LD2_Pin, GPIO_PIN_SET);    // pressed  -> LED on\n    }\n    else\n    {\n      HAL_GPIO_WritePin(LD2_GPIO_Port, LD2_Pin, GPIO_PIN_RESET);  // released -> LED off\n    }\n  }\n  /* USER CODE END 3 */\n}"}]}, "codeNote": "If you labelled PC13 as My_button, write <code>My_button_GPIO_Port, My_button_Pin<\/code> instead of B1.", "output": "LD2 stays on while B1 is held down and turns off as soon as it is released.", "remember": "<b>Button is upside-down<\/b>: pressed reads 0 (pull-up to 3.3 V, button connects to GND). So: read 0 → LED on.", "traps": ["Handout says the LED \"blinks\" when pressed; it is steadily on.", "My_button_Pin only exists if you set that user label; default name is B1_Pin."], "viva": [["Why does the pressed button read 0?", "PC13 is pulled up to 3.3 V; the button shorts it to GND when pressed (active-low)."], ["What is switch bounce?", "Mechanical contacts make and break several times for a few ms on each press. Fix with an RC filter (present on B1) or software debouncing (ignore changes for ~20 ms)."], ["Polling vs interrupt?", "Polling checks the pin every loop and wastes CPU; an EXTI interrupt runs code only on the edge and lets the CPU sleep or do other work."], ["What happens with a floating input?", "With no pull-up/pull-down the pin picks up noise and reads random values."], ["Write the LED toggle-on-press version.", "Detect a 1→0 transition (previous state 1, current 0), then call HAL_GPIO_TogglePin(LD2_GPIO_Port, LD2_Pin)."]]}]}, {"id": "e5", "num": "5", "title": "ADC with Potentiometer", "pick": "ADC with potentiometer", "board": "Nucleo-F401RE", "line": "Read a potentiometer on PA0 with the 12-bit ADC and print the value to the PC over USART2 once per second.", "parts": [{"conn": {"diagram": {"left": "Potentiometer (10 kΩ)", "right": "Nucleo-F401RE", "wires": [{"l": "End 1", "r": "3V3", "sig": "3.3 V", "kind": "pwr"}, {"l": "Wiper (middle)", "r": "PA0 / A0", "sig": "analog in", "kind": "s1", "dir": "r"}, {"l": "End 2", "r": "GND", "sig": "ground", "kind": "gnd"}]}, "rows": [["Pot end 1", "supply", "3V3"], ["Pot wiper (middle pin)", "ADC1_IN0", "PA0 (Arduino header A0)"], ["Pot end 2", "ground", "GND"]], "notes": ["Use <b>3.3 V, not 5 V<\/b>: the ADC full scale is 3.3 V.", "Swapping the two end pins only reverses the direction of the reading."]}, "setup": ["Connect the Nucleo-F401RE to the PC with the USB cable (the ST-LINK connector at the top of the board). This powers, programs and debugs the board.", "In STM32CubeIDE: <b>File → New → STM32 Project<\/b>. Open the <b>Board Selector<\/b> tab, search <b>NUCLEO-F401RE<\/b>, select it, click Next.", "Enter a project name. Keep Language = C and Binary = Executable. Set <b>Targeted Project Type = STM32Cube<\/b> (not Empty). Click Finish and answer <b>Yes<\/b> to “Initialize all peripherals with their default mode?”.", "Left-click <b>PA0 → ADC1_IN0<\/b>. Under Analog → ADC1 keep the defaults (12-bit, single conversion, software start). Check Connectivity → <b>USART2<\/b> is Asynchronous on PA2/PA3 at 115200 baud, 8N1.", "Save the .ioc file or click <b>Device Configuration Tool Code Generation<\/b> (gear icon). CubeMX writes <code>Core/Src/main.c<\/code> with all init functions.", "Open <code>Core/Src/main.c<\/code>. Write your code only between <code>/* USER CODE BEGIN … */<\/code> and <code>/* USER CODE END … */<\/code>; anything outside is erased on the next code generation.", "Build with the <b>hammer<\/b> icon. The console should end with “Build Finished. 0 errors, 0 warnings.”", "Flash: <b>Run → Debug Configurations → STM32 C/C++ Application<\/b> → Debugger tab → tick <b>ST-LINK S/N<\/b> → <b>Scan<\/b> → Apply → Debug. After “Download verified successfully”, press <b>Resume (F8)<\/b>.", "Open <b>PuTTY<\/b> → Connection type <b>Serial<\/b> → the COM port named “STMicroelectronics STLink Virtual COM Port” in Device Manager → Speed <b>115200<\/b> → Open. CubeIDE has no serial monitor of its own."], "code": {"short": [{"label": "main.c — includes and inside while(1)", "lang": "c", "code": "/* USER CODE BEGIN Includes */\n#include <stdio.h>      // sprintf\n#include <string.h>     // strlen\n/* USER CODE END Includes */\n\n/* inside while(1): */\nchar msg[10];\nHAL_ADC_Start(&hadc1);                              // 1. start\nHAL_ADC_PollForConversion(&hadc1, HAL_MAX_DELAY);   // 2. wait\nuint16_t v = HAL_ADC_GetValue(&hadc1);              // 3. read 0..4095\nsprintf(msg, \"%u\\r\\n\", v);                          // 4. number -> text\nHAL_UART_Transmit(&huart2, (uint8_t*)msg, strlen(msg), HAL_MAX_DELAY); // 5. send\nHAL_Delay(1000);                                    // once per second"}], "lab": [{"label": "main.c (handout)", "lang": "c", "code": "#include \"main.h\"\n/* USER CODE BEGIN Includes */\n#include \"stdio.h\"     // sprintf\n#include \"string.h\"    // strlen\n/* USER CODE END Includes */\n\nADC_HandleTypeDef hadc1;    // generated: ADC1 handle\nUART_HandleTypeDef huart2;  // generated: USART2 handle (ST-LINK virtual COM port)\n\nvoid SystemClock_Config(void);\nstatic void MX_GPIO_Init(void);\nstatic void MX_USART2_UART_Init(void);\nstatic void MX_ADC1_Init(void);      // generated: ADC1, channel 0 (PA0), 12-bit, software trigger\n\nint main(void)\n{\n  HAL_Init();\n  SystemClock_Config();\n  MX_GPIO_Init();\n  MX_USART2_UART_Init();\n  MX_ADC1_Init();\n\n  /* USER CODE BEGIN 2 */\n  uint16_t adc_value;   // 12-bit result, 0..4095\n  char msg[10];         // longest text \"4095\\r\\n\" + '\\0' = 7 bytes, so 10 is enough\n  /* USER CODE END 2 */\n\n  while (1)\n  {\n    /* USER CODE BEGIN 3 */\n    HAL_ADC_Start(&hadc1);                              // start one conversion\n    HAL_ADC_PollForConversion(&hadc1, HAL_MAX_DELAY);   // block until EOC flag set\n    adc_value = HAL_ADC_GetValue(&hadc1);               // read data register\n    sprintf(msg, \"%hu\\r\\n\", adc_value);                 // unsigned short -> text, CR LF\n    HAL_UART_Transmit(&huart2, (uint8_t*)msg, strlen(msg), HAL_MAX_DELAY);\n    HAL_Delay(1000);                                    // one reading per second\n  }\n  /* USER CODE END 3 */\n}\n\n// Optional: print volts as well (integer millivolts avoids enabling float printf):\n//   uint32_t mv = (uint32_t)adc_value * 3300 / 4095;\n//   sprintf(msg, \"%lu\\r\\n\", mv);   // needs msg[12] or larger"}]}, "output": "One number per second in PuTTY: about 0 at the GND end of the knob, about 4095 at the 3.3 V end, proportional in between. Volts = value × 3.3 / 4095.", "remember": "<b>Start → Poll → Get → Print → Send<\/b>. Volts = value × 3.3 / 4095. 1 LSB = 3.3/4096 ≈ 0.8 mV.", "traps": ["Baud rate is not given in the handout; PuTTY must use 115200 (Nucleo default) or you get garbage.", "\"Empty\" project issue again: choose STM32Cube."], "viva": [["Resolution and LSB voltage?", "12 bits, 4096 levels; 3.3/4096 ≈ 0.806 mV per count."], ["Convert reading 2048 to volts.", "2048 × 3.3 / 4095 ≈ 1.65 V."], ["What type of ADC?", "Successive approximation register (SAR)."], ["What does PollForConversion wait for?", "The EOC (end-of-conversion) flag in ADC_SR."], ["Polling vs interrupt vs DMA for ADC?", "Polling blocks the CPU; interrupt (HAL_ADC_Start_IT + callback) frees it per conversion; DMA moves continuous conversions to memory with no CPU work."], ["Why is there no Serial Monitor in CubeIDE?", "CubeIDE has no built-in terminal for the VCP in the default setup, so an external terminal (PuTTY, Tera Term) is used."], ["Effect of source impedance?", "A 10 kΩ pot has up to 2.5 kΩ output impedance; very short sampling times may not fully charge the sample capacitor. Increase sampling time (e.g., 84 cycles) for accuracy."]]}]}, {"id": "e6", "num": "6", "title": "UART Between Two Arduinos", "pick": "UART", "board": "2 × Arduino Uno", "line": "Full-duplex serial link: each board sends its name every 3 s over SoftwareSerial on D10/D11 and prints what it receives.", "parts": [{"conn": {"diagram": {"left": "Arduino 1", "right": "Arduino 2", "wires": [{"l": "D11 (TX)", "r": "D10 (RX)", "sig": "1 → 2", "kind": "s1", "dir": "r"}, {"l": "D10 (RX)", "r": "D11 (TX)", "sig": "2 → 1", "kind": "s2", "dir": "l"}, {"l": "GND", "r": "GND", "sig": "common ground", "kind": "gnd"}]}, "rows": [["Arduino 1 · D11 (TX)", "→", "Arduino 2 · D10 (RX)"], ["Arduino 1 · D10 (RX)", "←", "Arduino 2 · D11 (TX)"], ["Arduino 1 · GND", "common ground", "Arduino 2 · GND"]], "notes": ["TX always goes to the other board's RX: the lines cross.", "Leave D0/D1 unconnected; they carry the USB link to the PC."]}, "setup": ["Wire D10, D11 and GND as shown, with both boards unplugged.", "Plug both Unos into the PC. Note the two COM ports in Tools → Port (or Device Manager).", "Check the library: <b>Sketch → Include Library<\/b> should list <b>SoftwareSerial<\/b> (it ships with the Arduino IDE).", "Open the sketch with <code>myName = \"Arduino_1\"<\/code>, select board 1's port, Upload.", "Change it to <code>\"Arduino_2\"<\/code>, select board 2's port, Upload.", "Open a Serial Monitor for each port at <b>9600<\/b> baud. In Arduino IDE 2, open a second window (File → New Sketch), pick the other port there, and open its Serial Monitor."], "code": {"short": [{"label": "uart.ino — same on both boards, change myName", "lang": "c", "code": "#include <SoftwareSerial.h>\nSoftwareSerial link(10, 11);          // (RX, TX)\nString myName = \"Arduino_1\";          // \"Arduino_2\" on the other board\nunsigned long last = 0;\n\nvoid setup() { Serial.begin(9600); link.begin(9600); }\n\nvoid loop() {\n  if (millis() - last >= 3000) {      // SEND every 3 s\n    link.println(myName);\n    Serial.println(\"Transmitted: \" + myName);\n    last = millis();\n  }\n  if (link.available()) {             // RECEIVE\n    String s = link.readStringUntil('\\n');\n    s.trim();\n    Serial.println(\"Received: \" + s);\n  }\n}"}], "lab": [{"label": "uart_fullduplex.ino (handout)", "lang": "c", "code": "#include <SoftwareSerial.h>\n\nconst int rxPin = 10;                      // D10 = software RX\nconst int txPin = 11;                      // D11 = software TX\nSoftwareSerial customSerial(rxPin, txPin); // second UART, bit-banged in software\n\nString myName = \"Arduino_1\";               // on board 2 change this to \"Arduino_2\"\nunsigned long lastSendTime = 0;            // time of last transmission (ms)\nconst unsigned long sendInterval = 3000;   // send every 3000 ms\n\nvoid setup() {\n  Serial.begin(9600);       // hardware UART -> USB -> this board's Serial Monitor\n  while (!Serial);          // waits for USB serial on Leonardo/Micro; returns at once on Uno\n  customSerial.begin(9600); // board-to-board link, same baud on both boards\n  Serial.println(\"System Initialized. Starting full-duplex communication...\");\n}\n\nvoid loop() {\n  // TRANSMIT every 3 s without blocking (millis() timer instead of delay)\n  if (millis() - lastSendTime >= sendInterval) {\n    customSerial.println(myName);          // sends name + \"\\r\\n\"\n    Serial.print(\"Transmitted: \");\n    Serial.println(myName);\n    lastSendTime = millis();\n  }\n\n  // RECEIVE whenever bytes are waiting in SoftwareSerial's 64-byte buffer\n  if (customSerial.available() > 0) {\n    String incomingData = customSerial.readStringUntil('\\n'); // read up to newline (1 s timeout)\n    incomingData.trim();                   // strip the trailing '\\r'\n    if (incomingData.length() > 0) {\n      Serial.print(\"Received: \");\n      Serial.println(incomingData);\n    }\n  }\n}"}]}, "output": "Every 3 s on each Serial Monitor:", "outBlock": "Arduino 1 Serial Monitor          Arduino 2 Serial Monitor\nTransmitted: Arduino_1            Transmitted: Arduino_2\nReceived: Arduino_2               Received: Arduino_1", "remember": "<b>TX goes to RX<\/b> (cross), plus common GND. <code>SoftwareSerial(RX, TX)<\/code> — R before T, like the alphabet.", "traps": ["SoftwareSerial is not truly full-duplex: while sending it blocks receiving. Works here because messages are 3 s apart."], "viva": [["Why is UART called asynchronous?", "No shared clock. The receiver re-synchronises on every start bit's falling edge and samples each bit near its centre using its own baud-rate timer."], ["How much baud mismatch is tolerable?", "Roughly ±2–5% total; beyond that the sampling point drifts out of the last bits by the stop bit."], ["Why is a common ground needed?", "Voltage is measured relative to ground; without a shared reference the receiver cannot tell 0 from 1."], ["What does parity add?", "One extra bit making the count of 1s even or odd, which detects any single-bit error (not correct it)."], ["Why use millis() instead of delay(3000)?", "delay blocks the loop, so incoming bytes would not be read for 3 s and the 64-byte buffer could overflow. millis keeps the loop running."], ["Hardware vs software UART?", "Hardware UART has a dedicated shift register and interrupts per byte; software UART times each bit in code, uses CPU time, and has reliability limits at high baud."]]}]}, {"id": "e7", "num": "7", "title": "SPI & I2C", "pick": "SPI & I2C", "board": "2 × Arduino Uno", "line": "Two synchronous buses between two Unos: SPI (master sends a counter, slave replies +1) and I2C (text messages to a slave at address 8).", "parts": [{"pid": "spi", "label": "SPI", "conn": {"diagram": {"left": "Master (Arduino 1)", "right": "Slave (Arduino 2)", "wires": [{"l": "D13", "r": "D13", "sig": "SCK", "kind": "s1", "dir": "r"}, {"l": "D11", "r": "D11", "sig": "MOSI", "kind": "s2", "dir": "r"}, {"l": "D12", "r": "D12", "sig": "MISO", "kind": "s3", "dir": "l"}, {"l": "D10", "r": "D10", "sig": "SS (active low)", "kind": "s4", "dir": "r"}, {"l": "GND", "r": "GND", "sig": "common ground", "kind": "gnd"}]}, "rows": [["D13", "SCK: clock, master → slave", "D13"], ["D11", "MOSI: master → slave", "D11"], ["D12", "MISO: slave → master", "D12"], ["D10", "SS/CS: slave select, active LOW", "D10"], ["GND", "common ground", "GND"]], "notes": ["SPI lines are <b>not<\/b> crossed: each pin goes to the same pin on the other board.", "This pin map is for the Uno (ATmega328P). Other boards use different SPI pins."]}, "setup": ["Connect Arduino 1 alone, select its board and port, upload the <b>master<\/b> code.", "Connect Arduino 2, select its board and port, upload the <b>slave<\/b> code.", "Wire both boards as shown (unplug them while wiring).", "Open the master's Serial Monitor at <b>9600<\/b> baud (and the slave's in a second IDE window if you want both).", "Reset the slave first, then the master, so the first reply is 85."], "code": {"short": [{"label": "spi_master.ino — Arduino 1", "lang": "c", "code": "#include <SPI.h>\nbyte n = 0;\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(SS, OUTPUT);  digitalWrite(SS, HIGH);   // SS = D10, idle high\n  SPI.begin();\n  SPI.beginTransaction(SPISettings(100000, MSBFIRST, SPI_MODE0));\n}\n\nvoid loop() {\n  digitalWrite(SS, LOW);              // select slave\n  byte r = SPI.transfer(n);           // send n AND receive r together\n  digitalWrite(SS, HIGH);             // release\n  Serial.print(\"Master sent: \"); Serial.print(n);\n  Serial.print(\" | Master received: \"); Serial.println(r);\n  n++;  delay(1000);\n}"}, {"label": "spi_slave.ino — Arduino 2", "lang": "c", "code": "#include <SPI.h>\nvolatile byte rx;  volatile bool got = false;\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(MISO, OUTPUT);        // slave drives MISO\n  SPCR |= _BV(SPE);             // SPI on (slave mode)\n  SPI.attachInterrupt();        // run ISR after every byte\n  SPDR = 0x55;                  // first reply = 85\n}\n\nISR(SPI_STC_vect) { rx = SPDR;  SPDR = rx + 1;  got = true; }  // read, load reply\n\nvoid loop() {\n  if (got) { got = false;  Serial.print(\"Slave received: \"); Serial.println(rx); }\n}"}], "lab": [{"label": "spi_master.ino (handout)", "lang": "c", "code": "#include <SPI.h>\n\nconst int slaveSelectPin = 10;   // D10 drives the slave's SS (active LOW)\nbyte counter = 0;                // byte sent to the slave, increments every second\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(slaveSelectPin, OUTPUT);     // must be OUTPUT so the AVR stays SPI master\n  digitalWrite(slaveSelectPin, HIGH);  // slave not selected yet\n  SPI.begin();                         // SCK, MOSI as outputs; MISO input; SPI enabled as master\n  SPI.beginTransaction(SPISettings(100000, MSBFIRST, SPI_MODE0)); // 100 kHz, MSB first, Mode 0\n  Serial.println(\"SPI Master ready\");\n}\n\nvoid loop() {\n  byte received;\n  digitalWrite(slaveSelectPin, LOW);   // select slave\n  received = SPI.transfer(counter);    // send counter on MOSI, simultaneously read MISO\n  digitalWrite(slaveSelectPin, HIGH);  // deselect slave\n\n  Serial.print(\"Master sent: \");\n  Serial.print(counter);\n  Serial.print(\" | Master received: \");\n  Serial.println(received);\n\n  counter++;                           // byte wraps 255 -> 0\n  delay(1000);\n}"}, {"label": "spi_slave.ino (handout)", "lang": "c", "code": "#include <SPI.h>\n#include <avr/interrupt.h>\n\nvolatile byte receivedByte = 0;   // written in ISR, read in loop -> volatile\nvolatile bool newData = false;    // flag set by ISR when a byte arrives\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(MISO, OUTPUT);          // in slave mode MISO direction is set by the user\n  pinMode(SS, INPUT);             // D10 input: master pulls it LOW to select this board\n  SPCR |= _BV(SPE);               // SPI Enable; MSTR bit stays 0 -> slave mode\n  SPI.attachInterrupt();          // set SPIE: run ISR(SPI_STC_vect) after each byte\n  SPDR = 0x55;                    // first reply byte (85 decimal)\n  Serial.println(\"SPI Slave ready\");\n}\n\nISR(SPI_STC_vect) {               // SPI Serial Transfer Complete interrupt\n  receivedByte = SPDR;            // byte just received from master\n  SPDR = receivedByte + 1;        // load reply; it is shifted out during the NEXT transfer\n  newData = true;\n}\n\nvoid loop() {\n  if (newData) {\n    byte value;\n    noInterrupts();               // copy shared variables atomically\n    value = receivedByte;\n    newData = false;\n    interrupts();\n    Serial.print(\"Slave received: \");\n    Serial.print(value);\n    Serial.print(\" | Next response prepared: \");\n    Serial.println((byte)(value + 1));\n  }\n}"}]}, "output": "Once per second:", "outBlock": "Master                                   Slave\nMaster sent: 0 | Master received: 85     Slave received: 0 | Next response prepared: 1\nMaster sent: 1 | Master received: 1      Slave received: 1 | Next response prepared: 2\nMaster sent: 2 | Master received: 2      Slave received: 2 | Next response prepared: 3", "remember": "<b>SS low → transfer → SS high.<\/b> Slave: <b>SPE on, ISR reads SPDR and writes the reply into SPDR<\/b>. Reply comes out one transfer late.", "traps": ["“Master received” equals “Master sent” from the second transfer onward. This is not an echo: it is the slave's (previous byte + 1), delayed by one transfer.", "The handout's precaution about analog inputs is copied from Experiment 2 and does not apply here."], "viva": [["Is SPI full-duplex?", "Yes. Every clock shifts one bit out on MOSI and one bit in on MISO simultaneously."], ["Why does the master read 85 first?", "The slave preloaded SPDR = 0x55 (85) in setup; that is shifted out during the first transfer."], ["What are CPOL and CPHA?", "CPOL = clock idle level; CPHA = whether data is sampled on the first (0) or second (1) clock edge. Both sides must use the same mode."], ["SPI vs I2C?", "SPI: 4 wires, push-pull, tens of MHz, full-duplex, one SS per slave, no addressing or ACK. I2C: 2 wires, open-drain, 100/400 kHz typical, half-duplex, 7-bit addresses, ACK per byte."], ["Why volatile and noInterrupts()?", "volatile stops the compiler caching the variable in a register, since the ISR changes it. noInterrupts() makes the copy-and-clear atomic."], ["What does SPI.transfer return?", "The byte shifted in on MISO during that same 8-clock transfer."]]}, {"pid": "i2c", "label": "I2C", "conn": {"diagram": {"left": "Master (sketch_oct13b)", "right": "Slave, address 8 (sketch_oct13a)", "wires": [{"l": "A4", "r": "A4", "sig": "SDA (data)", "kind": "s1", "dir": "both"}, {"l": "A5", "r": "A5", "sig": "SCL (clock)", "kind": "s2", "dir": "r"}, {"l": "GND", "r": "GND", "sig": "common ground", "kind": "gnd"}]}, "rows": [["A4", "SDA: data, both directions", "A4"], ["A5", "SCL: clock from master", "A5"], ["GND", "common ground", "GND"]], "notes": ["<code>Wire.begin()<\/code> turns on the internal pull-ups, which are enough for short jumpers. A proper bus adds 4.7 kΩ from SDA and from SCL to 5 V.", "Your screenshot captions are swapped: the sketch with <code>Wire.begin()<\/code> (sketch_oct13b) is the master; <code>Wire.begin(8)<\/code> (sketch_oct13a) is the slave."]}, "setup": ["Upload the <b>master<\/b> code (sketch_oct13b) to one Uno and the <b>slave<\/b> code (sketch_oct13a) to the other.", "Wire A4, A5 and GND as shown.", "Open a Serial Monitor for each board at <b>9600<\/b> baud, with line ending set to <b>Newline<\/b>.", "Type a message in the master's monitor and press Enter: it appears on the slave.", "Type a new reply in the slave's monitor: the master prints it within 200 ms."], "code": {"short": [{"label": "i2c_master.ino (sketch_oct13b)", "lang": "c", "code": "#include <Wire.h>\nString last = \"\";\n\nvoid setup() { Wire.begin(); Serial.begin(9600); }     // no address = master\n\nvoid loop() {\n  if (Serial.available()) {                            // 1. SEND typed line\n    String s = Serial.readStringUntil('\\n');  s.trim();\n    Wire.beginTransmission(8);\n    Wire.write(s.c_str());                             // max 31 chars\n    byte err = Wire.endTransmission();                 // 0 = OK\n    Serial.println(err == 0 ? \"Message sent to Slave.\" : \"I2C error\");\n  }\n  Wire.requestFrom(8, 32);                             // 2. ASK for reply\n  String reply = \"\";\n  while (Wire.available()) { char c = Wire.read(); if (c) reply += c; }\n  if (reply.length() && reply != last) {               // print only if new\n    Serial.println(\"Reply from Slave: \" + reply);  last = reply;\n  }\n  delay(200);\n}"}, {"label": "i2c_slave.ino (sketch_oct13a)", "lang": "c", "code": "#include <Wire.h>\nchar msg[32];  volatile bool got = false;\nchar reply[32] = \"Hello from Arduino 2\";\n\nvoid onRx(int n) {                         // master WROTE to us\n  int i = 0;\n  while (Wire.available()) { char c = Wire.read(); if (i < 31) msg[i++] = c; }\n  msg[i] = 0;  got = true;\n}\nvoid onReq() { Wire.write((uint8_t*)reply, 32); }   // master ASKS: send 32 bytes\n\nvoid setup() {\n  Wire.begin(8);  Wire.onReceive(onRx);  Wire.onRequest(onReq);   // slave at 8\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  if (got) { got = false;  Serial.print(\"Message from Master: \"); Serial.println(msg); }\n  if (Serial.available()) {                       // type a new reply\n    String s = Serial.readStringUntil('\\n');  s.trim();\n    memset(reply, 0, 32);  s.toCharArray(reply, 32);\n    Serial.println(\"Reply updated.\");\n  }\n}"}], "lab": [{"label": "sketch_oct13b.ino — master, from your screenshots", "lang": "c", "code": "#include <Wire.h>\n\nconst byte SLAVE_ADDR = 8;   // 7-bit I2C address of the slave\nString inputText = \"\";       // characters typed in the Serial Monitor\nString lastReply = \"\";       // last reply printed, to avoid printing duplicates\n\nvoid setup() {\n  Wire.begin();              // no address -> join the bus as MASTER\n  Serial.begin(9600);\n  Serial.println(\"Type text to send to Slave:\");\n}\n\nvoid loop() {\n  // Read text from Serial Monitor, one character at a time\n  while (Serial.available()) {\n    char c = Serial.read();\n    if (c == '\\n' || c == '\\r') {                 // end of line -> send the message\n      if (inputText.length() > 0) {\n        Wire.beginTransmission(SLAVE_ADDR);       // START + address 8 + WRITE\n        for (int i = 0; i < inputText.length() && i < 31; i++) {\n          Wire.write((uint8_t)inputText[i]);      // queue up to 31 bytes\n        }\n        byte error = Wire.endTransmission();      // send queued bytes + STOP; returns status\n        if (error == 0) {\n          Serial.println(\"Message sent to Slave.\");\n        } else {\n          Serial.print(\"I2C send error: \");\n          Serial.println(error);\n        }\n        inputText = \"\";\n      }\n    } else if (inputText.length() < 31) {\n      inputText += c;                             // build the line, max 31 characters\n    }\n  }\n\n  // Request the Slave's reply: START + address 8 + READ, clock in 32 bytes\n  Wire.requestFrom(SLAVE_ADDR, (uint8_t)32);\n  String reply = \"\";\n  while (Wire.available()) {\n    char c = Wire.read();\n    if (c != '\\0') {\n      reply += c;                                 // keep real characters\n    } else {\n      // Ignore the remaining padding bytes\n    }\n  }\n  if (reply.length() > 0 && reply != lastReply) { // print only when the reply changes\n    Serial.print(\"Reply from Slave: \");\n    Serial.println(reply);\n    lastReply = reply;\n  }\n  delay(200);                                     // poll the slave 5 times per second\n}"}, {"label": "sketch_oct13a.ino — slave, lines 44+ reconstructed", "lang": "c", "code": "#include <Wire.h>\n#include <string.h>\n\nString inputText = \"\";                 // reply being typed in this board's Serial Monitor\nvolatile char receivedText[32];        // filled in receiveEvent (interrupt context)\nvolatile bool newMessage = false;      // set when a message from the master arrives\nchar replyText[32] = \"Hello from Arduino 2\";  // sent whenever the master requests\n\nvoid receiveEvent(int count) {         // runs when the master WRITES to address 8\n  byte i = 0;\n  while (Wire.available()) {\n    char c = Wire.read();\n    if (i < 31) {\n      receivedText[i++] = c;           // keep up to 31 characters\n    }\n  }\n  receivedText[i] = '\\0';              // terminate the string\n  newMessage = true;\n}\n\nvoid requestEvent() {                  // runs when the master READS from address 8\n  // Send exactly 32 bytes, including null padding\n  Wire.write((const uint8_t*)replyText, 32);\n}\n\nvoid setup() {\n  Wire.begin(8);                       // join the bus as SLAVE with address 8\n  Wire.onReceive(receiveEvent);\n  Wire.onRequest(requestEvent);\n  Serial.begin(9600);\n  Serial.println(\"Type reply to Master:\");\n}\n\nvoid loop() {\n  // Display received message\n  if (newMessage) {\n    char message[32];\n    // ---- reconstructed from here (screenshot ends at line 43) ----\n    noInterrupts();                    // copy the volatile buffer atomically\n    for (byte k = 0; k < 32; k++) message[k] = receivedText[k];\n    newMessage = false;\n    interrupts();\n    Serial.print(\"Message from Master: \");\n    Serial.println(message);\n  }\n\n  // Read a new reply from Serial Monitor\n  while (Serial.available()) {\n    char c = Serial.read();\n    if (c == '\\n' || c == '\\r') {\n      if (inputText.length() > 0) {\n        noInterrupts();                // requestEvent may read replyText at any moment\n        memset(replyText, 0, 32);      // clear old text -> null padding\n        inputText.toCharArray(replyText, 32);\n        interrupts();\n        Serial.println(\"Reply updated.\");\n        inputText = \"\";\n      }\n    } else if (inputText.length() < 31) {\n      inputText += c;\n    }\n  }\n}"}]}, "codeNote": "The lab version is transcribed from your screenshots. The slave screenshot ends at line 43; the rest is reconstructed from the variables it declares. Compare with the lab PC.", "output": "Example session:", "outBlock": "MASTER (COM25)                              SLAVE (COM16)\nType text to send to Slave:                 Type reply to Master:\nReply from Slave: Hello from Arduino 2\n> hi slave            (typed)               Message from Master: hi slave\nMessage sent to Slave.\n                                            > ok got it        (typed)\nReply from Slave: ok got it                 Reply updated.", "remember": "Master: <b>begin() · beginTransmission → write → endTransmission · requestFrom → read<\/b>. Slave: <b>begin "kind": "s4", "dir": "l"}, {"l": "LED1", "r": "K15", "sig": "cout", "kind": "pwr", "dir": "l"}]}, "rows": [["a", "SW0", "J15"], ["b", "SW1", "L16"], ["cin", "SW2", "M13"], ["sum", "LED0", "H17"], ["cout", "LED1", "K15"]], "rowHead": ["Verilog port", "On the board", "Package pin"], "notes": ["No jumper wires: the switches and LEDs are on the board. The .xdc file makes these connections, all at <b>LVCMOS33<\/b> (3.3 V).", "Pin numbers match the Digilent Nexys A7-100T (part xc7a100tcsg324-1). Connect the board by its USB-PROG port and turn the power switch on."]}, "setup": ["Vivado: <b>Create Project → RTL Project<\/b> → part <b>xc7a100tcsg324-1<\/b> (or pick the Nexys A7-100T board).", "Add Design Source <code>full_adder_ha.v<\/code> (both modules). Right-click <code>full_adder_ha<\/code> → <b>Set as Top<\/b>.", "Add Simulation Source <code>tb_full_adder_ha.v<\/code> and set it as top in Simulation Sources.", "Add Constraints <code>full_adder.xdc<\/code>.", "<b>Run Behavioral Simulation<\/b>. Check the waveform and Tcl console against the truth table.", "Optional: Open Elaborated Design → Schematic shows two half adders and an OR gate.", "<b>Run Synthesis → Run Implementation → Generate Bitstream<\/b>.", "<b>Open Hardware Manager → Open Target → Auto Connect → Program Device<\/b> with the .bit file.", "Flip SW0–SW2 and check LED0 (sum) and LED1 (cout) against the truth table."], "code": {"short": [{"label": "full_adder_ha.v", "lang": "v", "code": "module half_adder(input a, b, output sum, carry);\n  assign sum   = a ^ b;     // XOR\n  assign carry = a & b;     // AND\nendmodule\n\nmodule full_adder_ha(input a, b, cin, output sum, cout);\n  wire s1, c1, c2;\n  half_adder HA1(.a(a),  .b(b),   .sum(s1),  .carry(c1));\n  half_adder HA2(.a(s1), .b(cin), .sum(sum), .carry(c2));\n  assign cout = c1 | c2;\nendmodule"}, {"label": "tb.v — loop testbench", "lang": "v", "code": "`timescale 1ns/1ps\nmodule tb;\n  reg a, b, cin;  wire sum, cout;  integer i;\n  full_adder_ha uut(.a(a), .b(b), .cin(cin), .sum(sum), .cout(cout));\n  initial begin\n    $monitor(\"%b %b %b | sum=%b cout=%b\", a, b, cin, sum, cout);\n    for (i = 0; i < 8; i = i + 1) begin {a, b, cin} = i; #10; end\n    $finish;\n  end\nendmodule"}, {"label": "full_adder.xdc", "lang": "xdc", "code": "set_property -dict {PACKAGE_PIN J15 IOSTANDARD LVCMOS33} [get_ports a]    ;# SW0\nset_property -dict {PACKAGE_PIN L16 IOSTANDARD LVCMOS33} [get_ports b]    ;# SW1\nset_property -dict {PACKAGE_PIN M13 IOSTANDARD LVCMOS33} [get_ports cin]  ;# SW2\nset_property -dict {PACKAGE_PIN H17 IOSTANDARD LVCMOS33} [get_ports sum]  ;# LED0\nset_property -dict {PACKAGE_PIN K15 IOSTANDARD LVCMOS33} [get_ports cout] ;# LED1"}], "lab": [{"label": "full_adder_ha.v (your code)", "lang": "v", "code": "// --- Half Adder Module ---\nmodule half_adder (\n    input  a,\n    input  b,\n    output sum,\n    output carry\n);\n    assign sum   = a ^ b;   // XOR: 1 when exactly one input is 1\n    assign carry = a & b;   // AND: 1 when both inputs are 1\nendmodule\n\n// --- Full Adder Module using Two Half Adders ---   (set THIS as the top module)\nmodule full_adder_ha (\n    input  a,\n    input  b,\n    input  cin,\n    output sum,\n    output cout\n);\n    wire s1, c1, c2;        // s1 = a^b, c1 = a&b, c2 = s1&cin\n\n    half_adder HA1 (.a(a),  .b(b),   .sum(s1),  .carry(c1));   // first half adder: a + b\n    half_adder HA2 (.a(s1), .b(cin), .sum(sum), .carry(c2));   // second half adder: s1 + cin\n\n    assign cout = c1 | c2;  // carry out if either half adder produced a carry\nendmodule"}, {"label": "tb_full_adder_ha.v (your code)", "lang": "v", "code": "`timescale 1ns / 1ps        // added: makes #10 explicitly 10 ns (Vivado default is the same)\nmodule tb_full_adder_ha;\n    reg  a, b, cin;         // stimulus: reg because they are assigned inside initial\n    wire sum, cout;         // observed outputs: wire because a module drives them\n\n    full_adder_ha uut (.a(a), .b(b), .cin(cin), .sum(sum), .cout(co es.<\/b> Half adder = XOR + AND.", "traps": ["If half_adder is left as Top, synthesis builds only a half adder and the .xdc ports cin/cout are unmatched, so the bitstream fails.", "Every top-level port needs both PACKAGE_PIN and IOSTANDARD, or Generate Bitstream stops with an unconstrained-I/O error."], "viva": [["FPGA vs microcontroller?", "A microcontroller executes instructions sequentially on a fixed CPU. An FPGA is configured into custom hardware (LUTs, flip-flops, routing) that runs in parallel."], ["What is a LUT?", "A small SRAM truth table; a 6-input LUT can implement any Boolean function of 6 inputs. The Artix-7 100T has ~63k LUTs."], ["Why reg in the testbench but wire in the design?", "reg holds a value assigned procedurally (initial/always). wire is driven continuously by an assign or a module output."], ["What does the .xdc file do?", "Maps each top-level port to a physical package pin and sets its I/O voltage standard (LVCMOS33 = 3.3 V CMOS)."], ["Synthesis vs implementation?", "Synthesis converts RTL into a gate/LUT netlist. Implementation places that netlist on specific FPGA resources and routes the wires; bitstream generation then creates the configuration file."], ["Why can c1 and c2 not both be 1?", "c1 = 1 needs a = b = 1, which makes s1 = 0, so c2 = s1·cin = 0."], ["How to build a 4-bit ripple-carry adder?", "Chain four full adders, connecting each cout to the next stage's cin; delay grows linearly with width (carry ripple)."]]}]}], "ref": {"proto": [["", "UART (Exp 6)", "SPI (Exp 7)", "I2C (Exp 7)"], ["Wires", "TX, RX + GND", "SCK, MOSI, MISO, SS + GND", "SDA, SCL + GND"], ["Clock", "none (asynchronous)", "master drives SCK", "master drives SCL"], ["Duplex", "full", "full", "half"], ["Picking a slave", "point-to-point", "one SS line per slave", "7-bit address"], ["Acknowledge", "none (optional parity)", "none", "ACK/NACK every byte"], ["Driver", "push-pull", "push-pull", "open-drain + pull-ups"], ["Wiring rule", "crossed TX → RX", "same pin to <script>
(function(){
const D = JSON.parse(document.getElementById("data").textContent);
const EXPS = D.exps;
const TABS = [["connections","Connections"],["setup","Setup"],["code","Code"],["viva","Viva"]];
const state = {exp:"e1", part:0, tab:"connections", variant:"short", quiz:false};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- syntax colouring (C / Arduino, Verilog, XDC) ---------- */
const KW = {
  c: "void|int|float|char|byte|bool|const|unsigned|long|volatile|if|else|while|for|return|static|String|uint8_t|uint16_t|uint32_t|true|false|ISR",
  v: "module|endmodule|input|output|wire|reg|assign|initial|begin|end|for|integer",
  xdc: "set_property|get_ports"
};
const FN = {
  c: "HAL_\\w+|Serial|Wire|SPI|SPISettings|SoftwareSerial|digitalWrite|pinMode|delay|millis|micros|sin|sprintf|strlen|memset|noInterrupts|interrupts|_BV|PI|SPCR|SPDR|SPE|MISO|SS|HIGH|LOW|OUTPUT|INPUT|MSBFIRST|SPI_MODE0|GPIO_PIN_SET|GPIO_PIN_RESET|HAL_MAX_DELAY",
  v: "\\$\\w+|half_adder|full_adder_ha",
  xdc: "PACKAGE_PIN|IOSTANDARD|LVCMOS33|-dict"
};
function hl(code, lang){
  const src = esc(code);
  if (lang === "text") return src;
  const com = lang === "xdc" ? ";?#.*$" : "\\/\\/.*$|\\/\\*[\\s\\S]*?\\*\\/";
  const pp = lang === "c" ? "^\\s*#\\s*(?:include|define)[^\\n]*" : lang === "v" ? "`\\w+" : "(?!)";
  const re = new RegExp("("+com+")|(\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])')|("+pp+")|\\b("+KW[lang]+")\\b|(?:\\b|(?=[$-]))("+FN[lang]+")\\b|\\b(0x[0-9A-Fa-f]+|\\d+(?:\\.\\d+)?(?:e\\d+)?)\\b","gm");
  return src.replace(re, (m,c,s,p,k,f,n) =>
    c ? `<span class="tk-com">${m}</span>` : s ? `<span class="tk-str">${m}</span>` : p ? `<span class="tk-pp">${m}</span>` :
    k ? `<span class="tk-kw">${m}</span>` : f ? `<span class="tk-fn">${m}</span>` : `<span class="tk-num">${m}</span>`);
}

/* ---------- wiring diagram ---------- */
function diagram(d){
  const W = 560, BW = 150, top = 40, RH = 46, n = d.wires.length, H = top + n*RH + 18;
  const y = i => top + 26 + i*RH;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wiring between ${esc(d.left)} and ${esc(d.right)}">`;
  s += `<text class="dg-head" x="0" y="20">${esc(d.left)}</text><text class="dg-head" x="${W}" y="20" text-anchor="end">${esc(d.right)}</text>`;
  s += `<rect class="dg-box" x="0.5" y="${top-6}" width="${BW}" height="${n*RH+12}" rx="8"/>`;
  s += `<rect class="dg-box" x="${W-BW-0.5}" y="${top-6}" width="${BW}" height="${n*RH+12}" rx="8"/>`;
  const x1 = BW, x2 = W-BW, mid = W/2;
  d.wires.forEach((w,i) => {
    const k = "k-" + (w.kind || "s1"), yy = y(i);
    s += `<text class="dg-pin" x="${BW-14}" y="${yy+4}" text-anchor="end">${esc(w.l)}</text>`;
    s += `<text class="dg-pin" x="${W-BW+14}" y="${yy+4}">${esc(w.r)}</text>`;
    s += `<line class="${k}" x1="${x1}" y1="${yy}" x2="${x2}" y2="${yy}" stroke-width="2.5" fill="none"/>`;
    s += `<circle class="${k}" cx="${x1}" cy="${yy}" r="4.5"/><circle class="${k}" cx="${x2}" cy="${yy}" r="4.5"/>`;
    if (w.dir === "r" || w.dir === "both") s += `<polygon class="${k}" points="${x2-10},${yy-6} ${x2-10},${yy+6} ${x2-1},${yy}" transform="translate(-6 0)"/>`;
    if (w.dir === "l" || w.dir === "both") s += `<polygon class="${k}" points="${x1+10},${yy-6} ${x1+10},${yy+6} ${x1+1},${yy}" transform="translate(6 0)"/>`;
    s += `<text class="dg-sig ${k}" x="${mid}" y="${yy-8}" text-anchor="middle" style="fill:var(--w-${(w.kind||"s1").replace("k-","")})">${esc(w.sig)}</text>`;
  });
  return `<div class="diagram">${s}</svg></div>`;
}

function table(head, rows, cls=""){
  return `<div class="tbl-wrap"><table class="${cls}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function codeBlock(b, i){
  return `<div class="code"><div class="code-head"><span>${esc(b.label)}</span><button class="copy" type="button" data-copy="${i}">Copy</button></div><pre><code style="all:unset">${hl(b.code, b.lang)}</code></pre></div>`;
}

/* ---------- picker ---------- */
function renderPicker(){
  const items = EXPS.map(e => `<li><button class="pick" type="button" data-exp="${e.id}"><span class="n">${e.num.padStart(2,"0")}</span><span class="t">${esc(e.pick)}</span><span class="b">${esc(e.board)}</span></button></li>`);
  items.push(`<li class="ref"><button class="pick" type="button" data-exp="reference"><span class="n">★</span><span class="t">Quick reference</span><span class="b">Protocols and numbers</span></button></li>`);
  $("#picker").innerHTML = items.join("");
}

/* ---------- main ---------- */
let currentCode = [];
function render(){
  document.querySelectorAll(".pick").forEach(b => b.setAttribute("aria-current", b.dataset.exp === state.exp ? "true" : "false"));
  if (state.exp === "reference") return renderRef();
  const e = EXPS.find(x => x.id === state.exp), p = e.parts[state.part] || e.parts[0];
  let h = `<p class="kicker">Experiment ${e.num} · ${esc(e.board)}</p><h2 class="exp-title">${esc(e.title)}</h2><p class="lede">${e.line}</p>`;
  if (p.equation) h += `<div class="eq">${esc(p.equation)}</div>`;
  if (e.parts.length > 1) h += `<div><div class="seg" role="group" aria-label="Part">${e.parts.map((q,i)=>`<button type="button" data-part="${i}" aria-pressed="${i===state.part}">${String.fromCharCode(97+i)} · ${esc(q.label)}</button>`).join("")}</div></div>`;
  h += `<div class="tabs" role="tablist">${TABS.map(([id,l])=>`<button class="tab" role="tab" type="button" id="tab-${id}" data-tab="${id}" aria-selected="${state.tab===id}" aria-controls="panel">${l}${id==="viva"?`<span class="count">${p.viva.length}</span>`:""}</button>`).join("")}</div>`;
  h += `<section class="panel" id="panel" role="tabpanel" aria-labelledby="tab-${state.tab}">${panel(e,p)}</section>`;
  $("#main").innerHTML = h;
}

function panel(e,p){
  if (state.tab === "connections"){
    const c = p.conn; let h = "";
    if (c.diagram) h += `<div class="sec"><h3>Wiring</h3>${diagram(c.diagram)}</div>`;
    const head = c.rowHead || (c.diagram ? [c.diagram.left, "Signal", c.diagram.right] : ["Pin / port", "Role", "Connected to"]);
    h += `<div class="sec"><h3>${c.diagram ? "Pin table" : "Pins used"}</h3>${table(head, c.rows.map(r=>r.map((x,i)=>x)))}</div>`;
    if (c.notes) h += `<div class="sec"><h3>Notes</h3><ul class="notes">${c.notes.map(n=>`<li>${n}</li>`).join("")}</ul></div>`;
    return h;
  }
  if (state.tab === "setup"){
    return `<div class="sec"><h3>Procedure</h3><ol class="steps">${p.setup.map(s=>`<li><span>${s}</span></li>`).join("")}</ol></div>`;
  }
  if (state.tab === "code"){
    const v = p.code[state.variant] ? state.variant : "short";
    currentCode = p.code[v];
    let h = `<div class="toolbar"><div class="seg" role="group" aria-label="Code version"><button type="button" data-variant="short" aria-pressed="${v==="short"}">Short · to memorise</button><button type="button" data-variant="lab" aria-pressed="${v==="lab"}">Lab version</button></div></div>`;
    h += currentCode.map(codeBlock).join("");
    if (p.codeNote) h += `<p class="note">${p.codeNote}</p>`;
    if (p.remember) h += `<div class="callout remember"><b class="lbl">Remember</b>${p.remember}</div>`;
    h += `<div class="sec out"><h3>Expected output</h3><p class="note" style="color:var(--fg)">${p.output}</p>${p.outBlock?`<pre>${esc(p.outBlock)}</pre>`:""}${p.truth?table(p.truth[0], p.truth.slice(1),"truth"):""}</div>`;
    if (p.traps && p.traps.length) h += `<div class="callout traps"><b class="lbl">Handout errors and gotchas</b><ul>${p.traps.map(t=>`<li>${t}</li>`).join("")}</ul></div>`;
    return h;
  }
  const qs = p.viva.map(([q,a],i)=>`<details${state.quiz?"":" open"}><summary><span class="qn">Q${i+1}</span><span>${q}</span></summary><div class="ans"><p>${a}</p></div></details>`).join("");
  return `<div class="toolbar"><p class="note">${p.viva.length} questions. Turn on quiz mode to hide the answers and tap a question to check yourself.</p><button class="btn" type="button" id="quiz" aria-pressed="${state.quiz}">Quiz mode</button></div><div class="viva">${qs}</div>`;
}

function renderRef(){
  $("#main").innerHTML = `<p class="kicker">Quick reference</p><h2 class="exp-title">Protocols and numbers</h2><p class="lede">Everything examiners tend to ask for as a single value.</p>
    <section class="panel"><div class="sec"><h3>UART vs SPI vs I2C</h3>${table(D.ref.proto[0], D.ref.proto.slice(1))}</div>
    <div class="sec"><h3>Numbers to know</h3>${table(["Item","Value"], D.ref.nums)}</div></section>`;
}

/* ---------- routing: #e3, #e3-code, #e7-i2c-viva, #reference ---------- */
function toHash(){
  if (state.exp === "reference") return "reference";
  const e = EXPS.find(x => x.id === state.exp);
  let h = state.exp;
  if (e.parts.length > 1) h += "-" + e.parts[state.part].pid;
  return h + "-" + state.tab;
}
function fromHash(){
  const h = location.hash.slice(1);
  if (h === "reference"){ state.exp = "reference"; return; }
  const m = /^(e[1-8])(?:-(spi|i2c))?(?:-(connections|setup|code|viva))?$/.exec(h);
  if (!m) return;
  state.exp = m[1];
  const e = EXPS.find(x => x.id === m[1]);
  state.part = m[2] ? Math.max(0, e.parts.findIndex(p => p.pid === m[2])) : 0;
  if (m[3]) state.tab = m[3];
}
function go(push){
  render();
  const h = "#" + toHash();
  if (location.hash !== h) { try { history.replaceState(null, "", h); } catch(_){} }
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.dataset.exp){ state.exp = t.dataset.exp; state.part = 0; go(); $("#main").scrollIntoView({block:"start"}); return; }
  if (t.dataset.part){ state.part = +t.dataset.part; go(); return; }
  if (t.dataset.tab){ state.tab = t.dataset.tab; go(); return; }
  if (t.dataset.variant){ state.variant = t.dataset.variant; go(); return; }
  if (t.id === "quiz"){ state.quiz = !state.quiz; go(); return; }
  if (t.dataset.copy !== undefined){
    const text = currentCode[+t.dataset.copy].code;
    const done = () => { t.textContent = "Copied"; setTimeout(() => t.textContent = "Copy", 1400); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(t.closest(".code").querySelector("pre")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = "Selected — press Ctrl+C"; };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(_) { fallback(); }
  }
});
document.addEventListener("keydown", ev => {
  const t = ev.target.closest && ev.target.closest(".tab"); if (!t) return;
  const i = TABS.findIndex(x => x[0] === state.tab);
  if (ev.key === "ArrowRight" || ev.key === "ArrowLeft"){
    state.tab = TABS[(i + (ev.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length][0]; go(); $("#tab-" + state.tab).focus();
  }
});
window.addEventListener("hashchange", () => { fromHash(); render(); });

renderPicker(); fromHash(); go();
})();
</script>
